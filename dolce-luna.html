                {custoTotal > 0 && precoVenda > 0 && lucro < 0 && (
                  <div style={{ marginTop:8, background:"#2a0a0a", border:"1px solid #7f1d1d", borderRadius:8, padding:"8px 12px", fontSize:11, color:"#f87171" }}>
                    ⚠️ O custo de produção ({fmt(custoTotal)}) é maior que o preço de venda ({fmt(precoVenda)}). Você está vendendo com prejuízo de {fmt(Math.abs(lucro))} por unidade.
                  </div>
                )}

                {/* Sugestão de preço mínimo */}
                {custoTotal > 0 && precoVenda === 0 && (
                  <div style={{ marginTop:10, display:"flex", gap:8, flexWrap:"wrap" }}>
                    <div style={{ fontSize:10, color:"#6b5f80" }}>Sugestões de preço:</div>
                    {[
                      { label:"Margem 30%", pv: custoTotal / 0.70 },
                      { label:"Margem 40%", pv: custoTotal / 0.60 },
                      { label:"Margem 50%", pv: custoTotal / 0.50 },
                    ].map(s => (
                      <button key={s.label} onClick={()=>{ setPrecoVendaInput(s.pv.toFixed(2)); setEditPrecoVenda(true); }}
                        style={{ fontSize:10, padding:"3px 10px", borderRadius:6, border:"1px solid #3730a3", background:"#1a1030", color:"#818cf8", cursor:"pointer" }}>
                        {s.label}: {fmt(s.pv)}
                      </button>
                    ))}
                  </div>
                )}

                {/* ── Botões de ação dentro do card ── */}
                <div style={{ display:"flex", gap:8, marginTop:12, paddingTop:10,
                  borderTop:"1px solid #3730a366", flexWrap:"wrap" }}>
                  <button onClick={duplicarFicha}
                    style={{ padding:"6px 14px", borderRadius:8, border:"1px solid #3730a3",
                      background:"rgba(55,48,163,0.15)", color:"#818cf8",
                      fontWeight:700, fontSize:11, cursor:"pointer" }}>
                    📋 Duplicar
                  </button>
                  <button onClick={()=>{ setNovoModal("produto"); setNovoForm({ ...prodSel }); }}
                    style={{ padding:"6px 14px", borderRadius:8, border:"1px solid #4a3f60",
                      background:"rgba(74,63,96,0.15)", color:"#c8b8e8",
                      fontWeight:700, fontSize:11, cursor:"pointer" }}>
                    ✏️ Editar
                  </button>
                  {/* Excluir — alinhado à direita */}
                  <div style={{ flex:1 }}/>
                  <button onClick={excluirProduto}
                    style={{ padding:"6px 14px", borderRadius:8, border:"1px solid #7f1d1d",
                      background:"rgba(127,29,29,0.15)", color:"#f87171",
                      fontWeight:700, fontSize:11, cursor:"pointer" }}>
                    🗑 Excluir
                  </button>
                </div>
              </div>

              {/* Tabela */}
              <div style={{ background:"#13101e", border:"1.5px solid #2d2640", borderRadius:12, overflow:"hidden" }}>
                <div className="fichas-table-wrap" style={{ overflowX:"auto" }}>
                <table style={{ borderCollapse:"collapse", width:"100%", minWidth:460 }}>
                  <thead>
                    <tr>
                      <th style={thFT({ textAlign:"center", width:50 })}>Cód</th>
                      <th style={thFT({ textAlign:"left" })}>Produto/Serviço</th>
                      <th style={thFT({ textAlign:"center", width:70 })}>Unid.</th>
                      <th style={thFT({ textAlign:"right", width:90 })}>Quant.</th>
                      <th style={thFT({ textAlign:"right", width:100 })}>Valor</th>
                      <th style={thFT({ textAlign:"right", width:55 })}>% custo</th>
                      <th style={thFT({ width:36 })}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {fichas.length === 0
                      ? <tr><td colSpan={7} style={tdFT({ textAlign:"center", color:"#4a3f60", padding:24 })}>Nenhum insumo na ficha. Adicione abaixo.</td></tr>
                      : (()=>{
                          const isCombo = fichas.every(r => r.ref_produto_id);
                          let grupoAtual = null;
                          const allRows = [];
                          fichas.forEach((row, i) => {
                            if (isCombo) {
                              const pRef = produtos.find(p => p.id === Number(row.ref_produto_id));
                              const grupoNome = pRef?.subcategoria || pRef?.categoria || "Outros";
                              if (grupoNome !== grupoAtual) {
                                grupoAtual = grupoNome;
                                allRows.push(
                                  <tr key={"g-"+grupoNome+"-"+i}>
                                    <td colSpan={7} style={{ padding:"0",
                                      background:"#1a1030",
                                      borderTop: allRows.length>0?"2px solid #2d1254":"none",
                                      borderBottom:"1px solid #2d2640" }}>
                                      <div style={{ display:"flex", alignItems:"center",
                                        justifyContent:"space-between", padding:"7px 16px" }}>
                                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                                          <span style={{ fontSize:10, fontWeight:800, color:"#f59e0b",
                                            textTransform:"uppercase", letterSpacing:"0.06em" }}>
                                            📂 {grupoNome}
                                          </span>
                                          {maxPorGrupo[grupoNome] && (
                                            <span style={{ fontSize:9, color:"#4ade80", background:"#052e16",
                                              border:"1px solid #166534", borderRadius:4, padding:"1px 7px" }}>
                                              custo: R$ {maxPorGrupo[grupoNome].custo.toFixed(2)} ({maxPorGrupo[grupoNome].nome})
                                            </span>
                                          )}
                                        </div>
                                        <button
                                          onClick={()=>{ setAddGrupoAtivo(ag=>ag===grupoNome?null:grupoNome); setAddGrupoBusca(""); }}
                                          style={{ fontSize:11, padding:"2px 10px", borderRadius:99,
                                            border:"1px solid #f59e0b44", background:"#f59e0b11",
                                            color:"#f59e0b", cursor:"pointer", fontWeight:700 }}>
                                          + produto
                                        </button>
                                      </div>
                                      {/* Painel inline de busca ao clicar "+" */}
                                      {addGrupoAtivo === grupoNome && (
                                        <div style={{ borderTop:"1px solid #2d1254",
                                          background:"#13101e", padding:"8px 12px" }}>
                                          <input autoFocus value={addGrupoBusca}
                                            onChange={e=>setAddGrupoBusca(e.target.value)}
                                            onKeyDown={e=>{if(e.key==="Escape"){setAddGrupoAtivo(null);setAddGrupoBusca("");}}}
                                            placeholder="🔍 Buscar produto para adicionar..."
                                            style={{ width:"100%", background:"#0d0b15",
                                              border:"1px solid #f59e0b55", borderRadius:6,
                                              padding:"6px 10px", color:"#f0e8ff",
                                              fontSize:11, outline:"none", boxSizing:"border-box" }} />
                                          <div style={{ maxHeight:200, overflowY:"auto", marginTop:6 }}>
                                            {produtos
                                              .filter(p => !addGrupoBusca || p.nome.toLowerCase().includes(addGrupoBusca.toLowerCase()))
                                              .filter(p => !fichas.some(f2 => f2.ref_produto_id === p.id))
                                              .map(p => (
                                                <div key={p.id}
                                                  onClick={async ()=>{
                                                    // Atualiza subcategoria do produto para o grupo
                                                    try {
                                                      await fetch(`${SB_URL}/catalogo_produtos?id=eq.${p.id}`, {
                                                        method:"PATCH", headers:{...SB_H,"Prefer":"return=minimal"},
                                                        body: JSON.stringify({ subcategoria: grupoNome })
                                                      });
                                                      // Adiciona à ficha técnica
                                                      const r2 = await fetch(`${SB_URL}/ficha_tecnica`, {
                                                        method:"POST", headers:{...SB_H,"Prefer":"return=representation"},
                                                        body: JSON.stringify({
                                                          produto_id: prodSel.id,
                                                          ref_produto_id: p.id,
                                                          quantidade: 1,
                                                          insumo_cod: null,
                                                          receita_id: null,
                                                          ordem: fichas.length
                                                        })
                                                      });
                                                      if (r2.ok) {
                                                        const [novo] = await r2.json();
                                                        setFichas(prev => [...prev, novo]);
                                                        setProdutos(prev => prev.map(x => x.id===p.id ? {...x, subcategoria: grupoNome} : x));
                                                      }
                                                    } catch(e) { console.error(e); }
                                                    setAddGrupoAtivo(null); setAddGrupoBusca("");
                                                  }}
                                                  style={{ padding:"7px 10px", fontSize:11,
                                                    cursor:"pointer", borderRadius:6, marginBottom:2,
                                                    color:"#c8b8e8", background:"transparent" }}
                                                  onMouseEnter={e=>e.currentTarget.style.background="#1a1030"}
                                                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                                                  <div style={{ fontWeight:600 }}>{p.nome}</div>
                                                  <div style={{ fontSize:9, color:"#6b5f80" }}>
                                                    {p.categoria}{p.subcategoria?` · ${p.subcategoria}`:""} · custo: R$ {(custoProdMap[p.id]||0).toFixed(2)}
                                                  </div>
                                                </div>
                                              ))
                                            }
                                          </div>
                                        </div>
                                      )}
                                    </td>
                                  </tr>
                                );
                              }
                            }
                            const item  = resolveItem(row);
                            const valor = custo(row);
                            const edit  = editQtd[row.id] !== undefined;
                            allRows.push(
                              <tr key={row.id} style={{ background:i%2===0?"#0d0b15":"#100e1b" }}>
                                <td style={tdFT({ textAlign:"center", color:"#4a3f60", fontSize:11 })}>
                                  {item?._tipo==="receita" ? "📝" : item?._tipo==="produto" ? "🛍" : item?.cod||"—"}
                                </td>
                                <td style={tdFT({ fontWeight:500 })}>
                                  <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                                    {item?._tipo==="receita" && <span style={{ fontSize:9, background:"#1a1030", color:"#9333ea", padding:"1px 5px", borderRadius:4, flexShrink:0 }}>Receita</span>}
                                    {item?._tipo==="produto" && (()=>{
                                      const p = produtos.find(x => x.id === Number(row.ref_produto_id));
                                      const g = p?.subcategoria || p?.categoria || "Outros";
                                      const isMax = isComboCalc && maxPorGrupo[g]?.ref_produto_id === Number(row.ref_produto_id);
                                      return <>
                                        <span style={{ fontSize:9, background:"#1a1400", color:"#f59e0b", padding:"1px 5px", borderRadius:4, flexShrink:0 }}>Produto</span>
                                        {isComboCalc && (
                                          <span title={isMax ? "Produto mais caro do grupo — usado no cálculo do custo" : "Não é o mais caro do grupo — não entra no custo"}
                                            style={{ fontSize:9, padding:"1px 6px", borderRadius:4, flexShrink:0,
                                              background: isMax ? "#052e16" : "#1e1a2e",
                                              color: isMax ? "#4ade80" : "#4a3f60",
                                              border: `1px solid ${isMax ? "#166534" : "#2d2640"}` }}>
                                            {isMax ? "✓ no custo" : "fora do custo"}
                                          </span>
                                        )}
                                      </>;
                                    })()}
                                    <span>{item?.nome || <span style={{color:"#f87171"}}>Item não encontrado</span>}</span>
                                  </div>
                                </td>
                                <td style={tdFT({ textAlign:"center", color:"#8a7fa0", fontSize:11 })}>{item?.unid||"—"}</td>
                                <td style={tdFT({ textAlign:"center" })}>
                                  {edit
                                    ? <input type="number" step="0.001" min="0" autoFocus value={editQtd[row.id]}
                                        onChange={e=>setEditQtd(q=>({...q,[row.id]:e.target.value}))}
                                        onBlur={()=>salvarQtd(row, editQtd[row.id])}
                                        onKeyDown={e=>{if(e.key==="Enter")salvarQtd(row,editQtd[row.id]);if(e.key==="Escape")setEditQtd(q=>{const n={...q};delete n[row.id];return n;});}}
                                        style={{ width:60, background:"#0d0b15", border:"1px solid #7c3aed", borderRadius:6, padding:"3px 6px", color:"#c084fc", fontSize:11, textAlign:"center", outline:"none" }}/>
                                    : <span style={{ cursor:"pointer", color:"#c8b8e8" }}
                                        onClick={()=>setEditQtd(q=>({...q,[row.id]:String(row.quantidade)}))}>{row.quantidade}</span>}
                                </td>
                                <td style={tdFT({ textAlign:"right" })}>
                                  <span style={{ fontWeight:700, color:valor>0?"#f59e0b":"#3a3060" }}>
                                    {valor > 0 ? fmt(valor) : "—"}
                                  </span>
                                  {item?.preco > 0 && (
                                    <div style={{ fontSize:9, color:"#6b5f80", marginTop:2 }}>
                                      {fmt(item.preco)}/{item.unid}
                                    </div>
                                  )}
                                </td>
                                <td style={tdFT({ textAlign:"right", fontSize:10 })}>
                                  {custoTotal > 0 && valor > 0
                                    ? <span style={{ color: valor/custoTotal > 0.4 ? "#f87171" : "#8a7fa0" }}>
                                        {(valor/custoTotal*100).toFixed(0)}%
                                      </span>
                                    : null}
                                </td>
                                <td style={tdFT({ textAlign:"center" })}>
                                  <button onClick={()=>removerItem(row.id)} style={{ background:"none", border:"none", color:"#f87171", cursor:"pointer", fontSize:12 }}>🗑</button>
                                </td>
                              </tr>
                            );
                          });
                          return allRows;
                        })()
                    }
                    {fichas.length > 0 && (
                      <tr style={{ background:"#1a1030", borderTop:"2px solid #3730a3" }}>
                        <td colSpan={4} style={{ padding:"8px 10px", fontSize:12, fontWeight:700, color:"#9333ea", textAlign:"right" }}>Custo Total</td>
                        <td style={{ padding:"8px 10px", textAlign:"right" }}>
                          <div style={{ fontSize:14, fontWeight:900, color:"#f59e0b" }}>{fmt(custoTotal)}</div>
                          {fichas.some(r=>r.ref_produto_id) && (()=>{
                            const totalVenda = fichas.reduce((s,r)=>{
                              const it = resolveItem(r);
                              return s + (it?._tipo==="produto" ? Number(r.quantidade)*(it.preco||0) : 0);
                            },0);
                            return totalVenda > 0
                              ? <div style={{ fontSize:9, color:"#818cf8", marginTop:2 }}>venda: {fmt(totalVenda)}</div>
                              : null;
                          })()}
                        </td>
                        <td style={{ padding:"8px 10px", fontSize:11, color:"#6b5f80", textAlign:"right" }}>100%</td>
                        <td></td>
                      </tr>
                    )}
                  </tbody>
                </table>
                </div>
              </div>

              {/* Formulário adicionar */}
              <div style={{ background:"#0d0b15", border:"1.5px solid #1a3a20", borderRadius:12, padding:"12px 14px" }}>
                <div style={{ fontSize:11, fontWeight:700, color:"#4ade80", marginBottom:8 }}>+ Adicionar à Ficha</div>
                <div className="fichas-add-form" style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"flex-end" }}>
                  <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
                    <label style={{ fontSize:9, color:"#6b5f80", textTransform:"uppercase" }}>Tipo</label>
                    <select value={addForm.tipo} onChange={e=>{ setAddForm(f=>({...f,tipo:e.target.value,cod:""})); setAddOpen(false); setAddBusca(""); }}
                      style={{ ...selS, width:110 }}>
                      <option value="insumo">Insumo</option>
                      <option value="receita">📝 Receita</option>
                      <option value="produto">🛍 Produto</option>
                    </select>
                  </div>
                  {/* Seletor de grupo — só aparece em combos */}
                  {fichas.length > 0 && fichas.every(r => r.ref_produto_id) && addForm.tipo === "produto" && (
                    <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
                      <label style={{ fontSize:9, color:"#f59e0b", textTransform:"uppercase", fontWeight:700 }}>
                        📂 Grupo
                      </label>
                      {addForm.grupo === "__novo__" ? (
                        <div style={{ display:"flex", gap:4 }}>
                          <input autoFocus value={novoGrupoCombo}
                            onChange={e=>setNovoGrupoCombo(e.target.value)}
                            placeholder="Nome do grupo..."
                            style={{ ...selS, borderColor:"#f59e0b", width:140 }} />
                          <button onClick={()=>{ setAddForm(f=>({...f,grupo:""})); setNovoGrupoCombo(""); }}
                            style={{ padding:"4px 8px", borderRadius:6, border:"1px solid #2d2640",
                              background:"transparent", color:"#6b5f80", cursor:"pointer", fontSize:11 }}>✕</button>
                        </div>
                      ) : (
                        <select value={addForm.grupo||""}
                          onChange={e=>setAddForm(f=>({...f,grupo:e.target.value}))}
                          style={{ ...selS, borderColor: addForm.grupo?"#f59e0b":"", minWidth:140 }}>
                          <option value="">Selecione o grupo...</option>
                          {gruposCombo.map(g => (
                            <option key={g} value={g}>{g}</option>
                          ))}
                          <option value="__novo__">+ Novo grupo</option>
                        </select>
                      )}
                    </div>
                  )}
                  <div style={{ display:"flex", flexDirection:"column", gap:3, flex:2, minWidth:180 }}>
                    <label style={{ fontSize:9, color:"#6b5f80", textTransform:"uppercase" }}>
                      {addForm.tipo==="receita" ? "Receita de produção" : addForm.tipo==="produto" ? "Produto" : "Insumo"}
                    </label>
                    {(()=>{
                      // Monta lista de opções conforme tipo
                      const corBorda = addForm.tipo==="receita"?"#9333ea":addForm.tipo==="produto"?"#f59e0b":"#4ade80";
                      const opcoes = addForm.tipo==="receita"
                        ? receitas.map(r=>({ val:String(r.id), label:`📝 ${r.nome} (${r.unid}) — ${fmt(r._custoUnitario||0)}/${r.unid}`, nome:r.nome }))
                        : addForm.tipo==="produto"
                        ? [...produtos].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")).map(p=>({ val:String(p.id), label:`🛍 ${p.nome}${p.subcategoria?` · ${p.subcategoria}`:""} — ${fmt(Number(p.preco_venda)||0)}`, nome:p.nome }))
                        : [...insumos].sort((a,b)=>a.nome.localeCompare(b.nome)).map(i=>({ val:String(i.cod), label:`${i.nome} (${i.unid}) — ${fmt(i.preco)}/${i.unid}`, nome:i.nome }));

                      const busca = addBusca.toLowerCase();
                      const filtradas = busca ? opcoes.filter(o=>o.nome.toLowerCase().includes(busca)) : opcoes;

                      // Rótulo do item selecionado
                      const selLabel = addForm.cod ? (opcoes.find(o=>o.val===String(addForm.cod))?.label || "Selecione...") : (
                        addForm.tipo==="receita" ? "Selecione a receita..." : addForm.tipo==="produto" ? "Selecione o produto..." : "Selecione o insumo..."
                      );

                      return (
                        <div style={{ position:"relative", flex:2, minWidth:200 }}>
                          {/* Botão que abre o dropdown */}
                          <div onClick={()=>{ setAddOpen(o=>!o); setAddBusca(""); }}
                            style={{ ...selS, borderColor: addForm.cod ? corBorda : "",
                              display:"flex", alignItems:"center", justifyContent:"space-between",
                              cursor:"pointer", userSelect:"none", padding:"6px 10px" }}>
                            <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                              color: addForm.cod ? "#f0e8ff" : "#4a3f60", fontSize:12 }}>
                              {selLabel}
                            </span>
                            <span style={{ color:"#4a3f60", fontSize:10, flexShrink:0, marginLeft:6 }}>▼</span>
                          </div>

                          {/* Dropdown com busca */}
                          {addOpen && (
                            <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, zIndex:200,
                              background:"#13101e", border:"1.5px solid "+corBorda, borderRadius:10,
                              boxShadow:"0 8px 32px rgba(0,0,0,0.6)", overflow:"hidden" }}>
                              {/* Campo de busca */}
                              <div style={{ padding:"8px 10px", borderBottom:"1px solid #2d2640" }}>
                                <input autoFocus
                                  value={addBusca}
                                  onChange={e=>setAddBusca(e.target.value)}
                                  onKeyDown={e=>{ if(e.key==="Escape"){ setAddOpen(false); setAddBusca(""); }}}
                                  placeholder="🔍 Buscar..."
                                  style={{ width:"100%", background:"#0d0b15", border:"1px solid #2d2640",
                                    borderRadius:6, padding:"5px 10px", color:"#f0e8ff", fontSize:12, outline:"none",
                                    boxSizing:"border-box" }}
                                />
                              </div>
                              {/* Lista */}
                              <div style={{ maxHeight:220, overflowY:"auto" }}>
                                {filtradas.length === 0
                                  ? <div style={{ padding:"10px 14px", color:"#4a3f60", fontSize:11 }}>Nenhum resultado</div>
                                  : filtradas.map(o=>(
                                    <div key={o.val}
                                      onClick={()=>{ setAddForm(f=>({...f,cod:o.val})); setAddOpen(false); setAddBusca(""); }}
                                      style={{ padding:"8px 14px", fontSize:11, cursor:"pointer",
                                        color: addForm.cod===o.val ? corBorda : "#c8b8e8",
                                        background: addForm.cod===o.val ? `${corBorda}11` : "transparent",
                                        borderBottom:"1px solid #1e1a2e" }}
                                      onMouseEnter={e=>e.currentTarget.style.background=`${corBorda}22`}
                                      onMouseLeave={e=>e.currentTarget.style.background=addForm.cod===o.val?`${corBorda}11`:"transparent"}>
                                      {o.label}
                                    </div>
                                  ))
                                }
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })()}
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:3, flex:2, minWidth:180 }}>
                    <label style={{ fontSize:9, color:"#6b5f80", textTransform:"uppercase" }}>
                      Qtd {(() => {
                        if (!addForm.cod) return "";
                        if (addForm.tipo==="receita") { const r=receitas.find(x=>x.id===Number(addForm.cod)); return r?`(${r.unid})`:""; }
                        const i=insumos.find(x=>x.cod===Number(addForm.cod)); return i?`(${i.unid})`:"";
                      })()}
                    </label>
                    <input type="number" step="0.001" min="0" value={addForm.quantidade}
                      onChange={e=>setAddForm(f=>({...f,quantidade:e.target.value}))}
                      onKeyDown={e=>{ if(e.key==="Enter") adicionarItem(); }}
                      placeholder="0,000" style={{ ...selS, textAlign:"right", borderColor:addForm.quantidade?"#4ade80":"" }} />
                  </div>
                  {addForm.cod && addForm.quantidade && (() => {
                    let preco = 0;
                    if (addForm.tipo==="receita") { const r=receitas.find(x=>x.id===Number(addForm.cod)); preco=r?._custoUnitario||0; }
                    else { const i=insumos.find(x=>x.cod===Number(addForm.cod)); preco=i?.preco||0; }
                    return preco>0 ? <div style={{ fontSize:11, color:"#f59e0b", paddingBottom:6, }}>= {fmt(Number(addForm.quantidade)*preco)}</div> : null;
                  })()}
                  <button onClick={adicionarItem} disabled={salvando||!addForm.cod||!addForm.quantidade}
                    style={{ padding:"7px 18px", borderRadius:8, border:"none",
                      background:(!addForm.cod||!addForm.quantidade)?"#1a2e1a":"#16a34a",
                      color:"#fff", fontWeight:700, fontSize:12, cursor:"pointer", flexShrink:0, opacity:salvando?0.6:1 }}>
                    {salvando?"...":"Adicionar"}
                  </button>
                </div>
              </div>
            </div>
        }

                    <button
                      onClick={()=>{ if(!novoGrupoNome.trim()) return;

                      style={{ padding:"6px 14px", borderRadius:8, border:"1px solid #7c3aed",
                        background:"#2d1254", color:"#c084fc", fontWeight:700,
                        fontSize:11, cursor:"pointer", whiteSpace:"nowrap" }}>
                      + Grupo
                    </button>
                  </div>

                  {/* Custo total */}
                  {comboGrupos.some(g=>g.itens.length>0) && (
                    <div style={{ marginTop:12, padding:"8px 12px", background:"#0d0b15",
                      borderRadius:8, border:"1px solid #2d2640",
                      display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <span style={{ fontSize:10, color:"#6b5f80" }}>Custo total do combo</span>
                      <span style={{ fontSize:13, fontWeight:800, color:"#f59e0b" }}>
                        R$ {comboGrupos.reduce((s,g)=>s+g.itens.reduce((ss,i)=>ss+(custoProdMap[i.produto_id]||0)*i.qtd,0),0).toFixed(2)}
                      </span>
                    </div>
                  )}
                </div>

                {/* Botões */}
                <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
                  <button onClick={()=>{ setNovoModal(null); setComboGrupos([]); setNovoForm({}); }}
                    style={{ padding:"8px 16px", borderRadius:8, border:"1px solid #2d2640",
                      background:"transparent", color:"#6b5f80", cursor:"pointer", fontSize:12 }}>
                    Cancelar
                  </button>
                  <button onClick={criarCombo}
                    disabled={!novoForm.nome || comboGrupos.every(g=>g.itens.length===0)}
                    style={{ padding:"8px 20px", borderRadius:8, border:"none",
                      background: novoForm.nome && comboGrupos.some(g=>g.itens.length>0) ? "#f59e0b" : "#2d2640",
                      color: novoForm.nome && comboGrupos.some(g=>g.itens.length>0) ? "#0d0b15" : "#4a3f60",
                      cursor: novoForm.nome && comboGrupos.some(g=>g.itens.length>0) ? "pointer" : "not-allowed",
                      fontWeight:800, fontSize:12 }}>
                    🎁 Criar Combo
                  </button>
                </div>
              </div>
            </div>
          )}

          </div>
        </div>
      )}
    </div>
  );
}

  useEffect(() => {

    setMult(1);

    (async () => {
    try {
    const r = await fetch(`${SB_URL}/receita_ingredientes?receita_id=eq.${recSel.id}&order=ordem,id`, { headers: SB_H });
    const data = await r.json();
    setIngredientes(Array.isArray(data) ? data : []);
    } catch(e) { console.error(e); }
    })();
  }, [recSel]);


  const getInsumo = (cod) => insumos.find(i => i.cod === Number(cod));
  const getSubReceita = (id) => receitas.find(r => r.id === Number(id));
  const custoIng  = (row) => {
    if (row.sub_receita_id) {
      const subRec = getSubReceita(row.sub_receita_id);
      return subRec ? Number(row.quantidade) * Number(subRec._custoUnitario || 0) : 0;
    }
    const ins = getInsumo(row.insumo_cod);
    return ins ? Number(row.quantidade) * Number(ins.preco) : 0;
  };
  const custoTotalRec  = ingredientes.reduce((s,r) => s + custoIng(r), 0);
  const rendimento     = recSel ? Number(recSel.rendimento) || 1 : 1;
  const custoUnitario  = custoTotalRec / rendimento;
  // valores multiplicados (para exibição e impressão)
  const multVal        = Math.max(1, Number(mult) || 1);
  const custoTotalMult = custoTotalRec * multVal;
  const rendimentoMult = rendimento * multVal;


  const criarReceita = async () => {
    if (!novaForm.nome?.trim()) return;
    setSalvando(true);
    try {
    const r = await fetch(`${SB_URL}/receitas_base`, {
    method:"POST", headers:{ ...SB_H,"Prefer":"return=representation" },
    body: JSON.stringify({
    nome:       novaForm.nome.trim(),
    unid:       novaForm.unid || "KG",
    rendimento: Number(novaForm.rendimento) || 1,
    observacao: novaForm.observacao?.trim() || null,
    })
    });

    if (Array.isArray(data) && data[0]) {
    const nova = { ...data[0], _custoUnitario: 0 };
    setReceitas(prev => [...prev, nova]);
    setRecSel(nova);
    }

    setNovaForm({ nome:"", unid:"KG", rendimento:"1", observacao:"" });
    setSalvando(false);
  };


  // Recalcula custo total da receita e atualiza states
  const recalcCusto = (novosIngs) => {
    const custo = novosIngs.reduce((s, x) => {
      if (x.sub_receita_id) {
        const subRec = receitas.find(r => r.id === x.sub_receita_id);
        return s + (subRec ? Number(x.quantidade) * Number(subRec._custoUnitario || 0) : 0);
      }
      const ins = getInsumo(x.insumo_cod);
      return s + (ins ? Number(x.quantidade) * Number(ins.preco) : 0);
    }, 0) / rendimento;
    setReceitas(prev => prev.map(rec => rec.id === recSel.id ? {...rec, _custoUnitario: custo} : rec));
    setRecSel(prev => ({ ...prev, _custoUnitario: custo }));
    if (setRecIngredientes) setRecIngredientes(prev => [...prev.filter(i => i.receita_id !== recSel.id), ...novosIngs]);
  };

  const adicionarIngrediente = async () => {
    if (!addIng.insumo_cod || !addIng.quantidade || !recSel) return;
    setSalvando(true);
    // Detecta se é uma receita (cod começa com "rec_") ou insumo numérico
    const isReceita = String(addIng.insumo_cod).startsWith("rec_");
    const subReceitaId = isReceita ? Number(String(addIng.insumo_cod).replace("rec_","")) : null;
    const row = {
      receita_id:    recSel.id,
      insumo_cod:    isReceita ? null : Number(addIng.insumo_cod),
      sub_receita_id: subReceitaId,
      quantidade:    Number(String(addIng.quantidade).replace(",",".")),
      ordem:         ingredientes.length,
    };
    try {
      const r = await fetch(`${SB_URL}/receita_ingredientes`, {
        method:"POST", headers:{ ...SB_H,"Prefer":"return=representation" },
        body: JSON.stringify(row)
      });
      if (!r.ok) {
        const errText = await r.text();
        // Se a coluna sub_receita_id não existe, tenta sem ela (fallback)
        if (errText.includes("sub_receita_id") || errText.includes("column")) {
          const rowSimples = { receita_id: recSel.id, insumo_cod: isReceita ? subReceitaId : Number(addIng.insumo_cod), quantidade: row.quantidade, ordem: row.ordem };
          const r2 = await fetch(`${SB_URL}/receita_ingredientes`, {
            method:"POST", headers:{ ...SB_H,"Prefer":"return=representation" },
            body: JSON.stringify(rowSimples)
          });
          if (!r2.ok) { alert("❌ Erro ao adicionar ingrediente: " + errText); setSalvando(false); return; }
          const data2 = await r2.json();
          if (Array.isArray(data2) && data2[0]) {
            const novosIngs = [...ingredientes, data2[0]];
            setIngredientes(novosIngs);
            recalcCusto(novosIngs);
          }
        } else {
          alert("❌ Erro: " + errText.slice(0,300));
        }
        setAddIng({ insumo_cod:"", quantidade:"" });
        setSalvando(false);
        return;
      }
      const data = await r.json();
      if (Array.isArray(data) && data[0]) {
        const novosIngs = [...ingredientes, data[0]];
        setIngredientes(novosIngs);
        recalcCusto(novosIngs);
      }
      setAddIng({ insumo_cod:"", quantidade:"" });
    } catch(e) { console.error(e); alert("❌ Erro: " + e.message); }
    setSalvando(false);
  };

  const salvarQtdIng = async (row, novaQtd) => {
    const qtd = Number(String(novaQtd).replace(",","."));
    if (isNaN(qtd)) { setEditQtd(e=>({...e,[row.id]:undefined})); return; }
    try {
    await fetch(`${SB_URL}/receita_ingredientes?id=eq.${row.id}`, { method:"PATCH", headers:{...SB_H,"Prefer":"return=minimal"}, body: JSON.stringify({ quantidade: qtd }) });
    const novosIngs = ingredientes.map(r => r.id===row.id ? {...r,quantidade:qtd} : r);
    setIngredientes(novosIngs);
    const novoCusto = novosIngs.reduce((s,x)=>{ const ins=getInsumo(x.insumo_cod); return s+(ins?Number(x.quantidade)*Number(ins.preco):0); },0)/rendimento;
    setReceitas(prev => prev.map(rec => rec.id===recSel.id ? {...rec,_custoUnitario:novoCusto} : rec));
    if (setRecIngredientes) setRecIngredientes(prev => [...prev.filter(i=>i.receita_id!==recSel.id), ...novosIngs]);
    } catch(e) { console.error(e); }
    setEditQtd(e=>({...e,[row.id]:undefined}));
  };

  const removerIngrediente = async (id) => {
    try {
    await fetch(`${SB_URL}/receita_ingredientes?id=eq.${id}`, { method:"DELETE", headers:SB_H });
    const novosIngs = ingredientes.filter(r => r.id !== id);
    setIngredientes(novosIngs);
    const novoCusto = novosIngs.reduce((s,x)=>{ const ins=getInsumo(x.insumo_cod); return s+(ins?Number(x.quantidade)*Number(ins.preco):0); },0)/rendimento;
    setReceitas(prev => prev.map(rec => rec.id===recSel.id ? {...rec,_custoUnitario:novoCusto} : rec));
    if (setRecIngredientes) setRecIngredientes(prev => [...prev.filter(i=>i.receita_id!==recSel.id), ...novosIngs]);

  const excluirReceita = async (id) => {

    setReceitas(prev => prev.filter(r => r.id !== id));
    setRecSel(null);
    } catch(e) { console.error(e); }

  const [duplicando, setDuplicando] = useState(false);

    if (!recSel || duplicando) return;

    try {
      // 1. Monta payload apenas com campos da tabela receitas_base
      // Busca colunas reais da tabela para montar payload seguro
      const rCols = await fetch(`${SB_URL}/receitas_base?limit=1`, { headers: SB_H });
      const [sample] = await rCols.json();
      const colunasValidas = sample ? Object.keys(sample) : [];
      console.log("[Duplicar] Colunas disponíveis:", colunasValidas);
      // Monta payload apenas com campos que existem na tabela
      const candidato = {
        nome:        recSel.nome + " (Cópia)",
        rendimento:  recSel.rendimento  || 1,
        unid:        recSel.unid        || "un",
        preparo:     recSel.preparo     || null,

        observacoes: recSel.observacoes || null,
        categoria:   recSel.categoria   || null,
        subcategoria:recSel.subcategoria|| null,
        ativo:       true,
      };
      const novaBase = colunasValidas.length > 0
        ? Object.fromEntries(Object.entries(candidato).filter(([k]) => colunasValidas.includes(k)))
        : { nome: candidato.nome, rendimento: candidato.rendimento, unid: candidato.unid, ativo: true };
      console.log("[Duplicar] Payload:", novaBase);

        const novosIngs = ings.map(i => {
          const c = candidatoIng(i);
          return colsIng ? Object.fromEntries(Object.entries(c).filter(([k]) => colsIng.includes(k))) : c;

        console.log("[Duplicar] Ingredientes payload:", novosIngs);
        const r3 = await fetch(`${SB_URL}/receita_ingredientes`, {

      const recComCusto = { ...novaRec, _custoUnitario: recSel._custoUnitario || 0 };
      setReceitas(prev => [...prev, recComCusto]);
      // Busca os ingredientes recém-criados do banco para garantir IDs corretos
      try {
        const rIng = await fetch(`${SB_URL}/receita_ingredientes?receita_id=eq.${novaRec.id}&order=ordem,id`, { headers: SB_H });
        const ingsNovos = await rIng.json();
        if (Array.isArray(ingsNovos) && ingsNovos.length > 0) {
          setIngredientes(ingsNovos);
          if (setRecIngredientes) setRecIngredientes(prev => [...prev.filter(i => i.receita_id !== novaRec.id), ...ingsNovos]);
        }
      } catch(e) { console.warn("[Duplicar] Erro ao buscar ings criados:", e); }

    body: JSON.stringify({ modo_preparo: txt || null })
    });
    setReceitas(prev => prev.map(r => r.id===recSel.id ? {...r, modo_preparo: txt||null} : r));

    };
    try {
    await fetch(`${SB_URL}/receitas_base?id=eq.${recSel.id}`, {

    </tr>`;

    ✕ ${multVal} — Receita multiplicada por ${multVal}x &nbsp;|&nbsp; Rendimento total: ${rendimentoMult.toLocaleString("pt-BR")} ${recSel.unid}
    </div>` : "";

          await fetch(`${SB_URL}/insumos?cod=eq.${item.insumo_cod}`, { method:"PATCH", headers:{ ...SB_H,"Prefer":"return=minimal" }, body: JSON.stringify({ preco: item.preco_unitario, updated_at: new Date().toISOString() }) });
          onUpdateInsumo(item.insumo_cod, item.preco_unitario);
        }
        onSaveCompra(registro);
      }
      // Salva fornecedores usados nos itens — fire-and-forget
      itensPend.forEach(i => { if(i.fornecedor) salvarFornecedor(i.fornecedor); });
      setItensPend([]);
      setForm(f => ({ ...f, insumo_cod:"", quantidade:"", preco_unitario:"", total_pago:"", fornecedor:"", observacao:"" }));
    } catch(e) { console.error("Erro ao salvar compras:", e); }
    setSalvando(false);
  };

  const salvarCompra = async () => {
    if (!form.insumo_cod || !form.quantidade || !form.preco_unitario) return;
    setSalvando(true);
    const pu = Number(String(form.preco_unitario).replace(",","."));
    const registro = {
      data: form.data,
      insumo_cod: Number(form.insumo_cod),
      insumo_nome: insumoSel?.nome || "",
      quantidade: Number(form.quantidade),
      unid: insumoSel?.unid || "KG",
      preco_unitario: pu,
      fornecedor: form.fornecedor || null,
      observacao: form.observacao || null,
    };
    try {
      const rPost = await fetch(`${SB_URL}/compras`, { method:"POST", headers:{ ...SB_H,"Prefer":"return=representation" }, body: JSON.stringify(registro) });
      if (!rPost.ok) { const e = await rPost.text(); console.error("Erro compra:", e); throw new Error(e); }
      const [saved] = await rPost.json();
      if (saved?.id) registro.id = saved.id;
      // Só atualiza preço do insumo se a data da compra for >= a última compra existente
      const comprasDoInsumoAtual = compras.filter(c => c.insumo_cod === Number(form.insumo_cod));
      const ultimaData = comprasDoInsumoAtual.length > 0
        ? comprasDoInsumoAtual.reduce((max, c) => c.data > max ? c.data : max, "")
        : "";
      if (form.data >= ultimaData) {
        await fetch(`${SB_URL}/insumos?cod=eq.${form.insumo_cod}`, { method:"PATCH", headers:{ ...SB_H,"Prefer":"return=minimal" }, body: JSON.stringify({ preco: pu, updated_at: new Date().toISOString() }) });
        onUpdateInsumo(Number(form.insumo_cod), pu);
      }
      onSaveCompra(registro);
      if (form.fornecedor) salvarFornecedor(form.fornecedor); // fire-and-forget
      setForm(f => ({ ...f, quantidade:"", preco_unitario:"", fornecedor:"", observacao:"" }));
    } catch(e) { console.error("Erro ao salvar compra:", e); }
    setSalvando(false);
  };

  const salvarNovoInsumo = async () => {
    if (!novoInsumo.nome.trim()) return;
    const cod = Math.max(0, ...insumos.map(i=>i.cod)) + 1;
    const ins = { cod, nome: novoInsumo.nome.trim(), unid: novoInsumo.unid, preco: 0 };
    try {
      await fetch(`${SB_URL}/insumos`, { method:"POST", headers:{ ...SB_H,"Prefer":"return=minimal" }, body: JSON.stringify(ins) });
      onAddInsumo(ins);
      setNovoInsumo({ nome:"", unid:"KG" });
      setMostrarNovoInsumo(false);
    } catch(e) { console.error("Erro ao criar insumo:", e); }
  };

  const deletarCompra = async (c) => {
    try {
      await fetch(`${SB_URL}/compras?id=eq.${c.id}`, { method:"DELETE", headers:SB_H });
      onDeleteCompra(c.id);
    } catch(e) { console.error("Erro ao deletar:", e); }
    setConfirmDel(null);
  };

  const MESES_PT = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const fmtMes = m => { if(!m) return ""; const [y,mo]=m.split("-"); return `${MESES_PT[parseInt(mo)-1]}/${y}`; };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
      {/* Header */}
      <div style={{ background:"#13101e", border:"1.5px solid #2d2640", borderRadius:12, padding:"12px 16px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8 }}>
        <div>
          <div style={{ fontSize:13, fontWeight:800, color:"#c084fc", marginBottom:2 }}>🛒 Entradas de Mercadoria</div>
          <div style={{ fontSize:11, color:"#6b5f80" }}>{insumos.length} insumos cadastrados · {compras.length} compras registradas</div>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={()=>fileInputRef.current?.click()}
            style={{ fontSize:11, fontWeight:700, padding:"7px 14px", borderRadius:8, border:"1px solid #f59e0b", background:"#1a1000", color:"#f59e0b", cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
            📷 Escanear Nota
          </button>
          <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{ display:"none" }}
            onChange={e=>{ if(e.target.files[0]) escanearNota(e.target.files[0]); e.target.value=""; }} />
          <button onClick={()=>setMostrarNovoInsumo(v=>!v)}
            style={{ fontSize:11, fontWeight:700, padding:"6px 14px", borderRadius:8, border:"1px solid #7c3aed", background:"#2d1254", color:"#e9d5ff", cursor:"pointer" }}>
            + Novo Insumo
          </button>
        </div>
      </div>

      {/* Painel de scan da nota fiscal */}
      {scanStatus !== "idle" && (
        <div style={{ background:"#13101e", border:"1.5px solid " + (scanStatus==="error"?"#f87171":scanStatus==="scanning"?"#f59e0b":"#4ade80"), borderRadius:12, overflow:"hidden" }}>
          <div style={{ padding:"12px 16px", background:"#0d0b15", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:22 }}>{scanStatus==="scanning"?"⏳":scanStatus==="done"?"✅":"❌"}</span>
              <div>
                <div style={{ fontSize:13, fontWeight:800, color:scanStatus==="error"?"#f87171":scanStatus==="scanning"?"#f59e0b":"#4ade80" }}>
                  {scanStatus==="scanning" ? "Analisando nota fiscal com IA..." : scanStatus==="done" ? scanResultados.length+" item"+(scanResultados.length!==1?"s":"")+" identificado"+(scanResultados.length!==1?"s":"") : "Não foi possível identificar itens"}
                </div>
                <div style={{ fontSize:10, color:"#6b5f80", marginTop:2 }}>
                  {scanStatus==="scanning" ? "Aguarde, isso pode levar alguns segundos..." : scanStatus==="done" ? "Clique em um item para preencher o formulário" : "Tente uma foto mais nítida e bem iluminada"}
                </div>
              </div>
            </div>
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              {scanPreview && (
                <img src={scanPreview} alt="Nota" style={{ height:48, width:48, objectFit:"cover", borderRadius:6, border:"1px solid #2d2640", cursor:"pointer" }}
                  onClick={()=>window.open(scanPreview,"_blank")} title="Ver imagem completa" />
              )}
              <button onClick={()=>{ setScanStatus("idle"); setScanResultados([]); setScanPreview(null); }}
                style={{ background:"none", border:"none", color:"#6b5f80", cursor:"pointer", fontSize:20, padding:"0 4px" }}>✕</button>
            </div>
          </div>
          {scanStatus==="done" && scanResultados.length > 0 && (
            <div>
              {scanResultados.map((item, idx) => {
                const matchCod  = insumos.find(i => i.cod === Number(item.insumo_cod));
                const matchNome = !matchCod && item.insumo_nome
                  ? insumos.find(i => i.nome.toLowerCase().includes((item.insumo_nome||"").toLowerCase().slice(0,6)))
                  : null;
                const insumoFinal = matchCod || matchNome;
                const total = item.quantidade && item.preco_unitario ? Number(item.quantidade)*Number(item.preco_unitario) : 0;
                return (
                  <div key={idx}
                    style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 16px", borderTop:"1px solid #1a1628", cursor:"pointer" }}
                    onClick={()=>aplicarItemScan(item)}
                    onMouseEnter={e=>e.currentTarget.style.background="#1a1628"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                        <span style={{ fontSize:12, fontWeight:700, color:"#f0e8ff" }}>{item.insumo_nome}</span>
                        {insumoFinal
                          ? <span style={{ fontSize:10, background:"#0a1f0a", border:"1px solid #1a3a1a", color:"#4ade80", padding:"1px 6px", borderRadius:4 }}>✓ {insumoFinal.nome}</span>
                          : <span style={{ fontSize:10, background:"#1a0a0a", border:"1px solid #3a1a1a", color:"#f87171", padding:"1px 6px", borderRadius:4 }}>⚠ Não mapeado</span>
                        }
                      </div>
                      <div style={{ fontSize:11, color:"#6b5f80", marginTop:3 }}>
                        {item.quantidade && <span>{Number(item.quantidade).toLocaleString("pt-BR")} × </span>}
                        {item.preco_unitario && <span style={{color:"#f59e0b"}}>{fmt(item.preco_unitario)}</span>}
                        {item.fornecedor && <span style={{marginLeft:8}}>· {item.fornecedor}</span>}
                        {item.data && <span style={{marginLeft:8}}>· {fmtDate(item.data)}</span>}
                      </div>
                    </div>
                    <div style={{ textAlign:"right", flexShrink:0, marginLeft:12 }}>
                      {total > 0 && <div style={{ fontSize:13, fontWeight:800, color:"#c084fc" }}>{fmt(total)}</div>}
                      <div style={{ fontSize:10, color:"#4a3f60", marginTop:2 }}>Clique para usar →</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* Novo Insumo */}
      {mostrarNovoInsumo && (
        <div style={{ background:"#1a1030", border:"1.5px solid #7c3aed", borderRadius:12, padding:"14px 16px", display:"flex", gap:10, alignItems:"flex-end", flexWrap:"wrap" }}>
          <div style={{ display:"flex", flexDirection:"column", gap:3, flex:1, minWidth:180 }}>
            <label style={{ fontSize:10, color:"#9333ea", fontWeight:700, textTransform:"uppercase" }}>Nome do Insumo</label>
            <input value={novoInsumo.nome} onChange={e=>setNovoInsumo(n=>({...n,nome:e.target.value}))}
              placeholder="Ex: Chocolate Amargo Premium" style={{ ...selS }} />
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            <label style={{ fontSize:10, color:"#9333ea", fontWeight:700, textTransform:"uppercase" }}>Unidade</label>
            <select value={novoInsumo.unid} onChange={e=>setNovoInsumo(n=>({...n,unid:e.target.value}))} style={selS}>
              {["KG","Gr","Ml","Unidade","Litro","Cx"].map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
          <button onClick={salvarNovoInsumo}
            style={{ padding:"6px 18px", borderRadius:8, border:"none", background:"#7c3aed", color:"#fff", fontWeight:700, fontSize:12, cursor:"pointer" }}>
            Criar
          </button>
          <button onClick={()=>setMostrarNovoInsumo(false)}
            style={{ padding:"6px 12px", borderRadius:8, border:"1px solid #3a3060", background:"none", color:"#8a7fa0", cursor:"pointer", fontSize:12 }}>
            Cancelar
          </button>
        </div>
      )}

      {/* Formulário de entrada */}
      <div style={{ background:"#13101e", border:"1.5px solid #1a3a20", borderRadius:12, padding:"14px 16px" }}>
        <div style={{ fontSize:12, fontWeight:700, color:"#4ade80", marginBottom:10 }}>📥 Registrar Nova Compra</div>
        <div style={{ display:"grid", gridTemplateColumns: isMob?"1fr 1fr":"1fr 1fr 1fr 1fr 1fr", gap:8, marginBottom:8 }}>
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            <label style={{ fontSize:10, color:"#6b5f80", fontWeight:600, textTransform:"uppercase" }}>📅 Data</label>
            <input type="date" value={form.data} onChange={e=>setForm(f=>({...f,data:e.target.value}))} style={selS} />
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:3, gridColumn: isMob?"span 1":"span 2" }}>
            <label style={{ fontSize:10, color:"#6b5f80", fontWeight:600, textTransform:"uppercase" }}>🧾 Insumo</label>
            {(()=>{
              const insumoSorted = [...insumos].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
              const insumoFilt   = insumoBusca
                ? insumoSorted.filter(i=>i.nome.toLowerCase().includes(insumoBusca.toLowerCase()))
                : insumoSorted;
              const insumoSel2   = insumos.find(i=>i.cod===Number(form.insumo_cod));
              return (
                <div style={{ position:"relative" }}>
                  {/* Botão */}
                  <div onClick={()=>{ setInsumoOpen(o=>!o); setInsumoBusca(""); }}
                    style={{ ...selS, display:"flex", alignItems:"center", justifyContent:"space-between",
                      cursor:"pointer", userSelect:"none", padding:"6px 10px",
                      borderColor: form.insumo_cod?"#4ade80":"" }}>
                    <span style={{ fontSize:12, color:form.insumo_cod?"#f0e8ff":"#4a3f60",
                      overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                      {insumoSel2 ? `${insumoSel2.nome} (${insumoSel2.unid})` : "Selecione o insumo..."}
                    </span>
                    <span style={{ color:"#4a3f60", fontSize:10, flexShrink:0, marginLeft:6 }}>▼</span>
                  </div>

                  {/* Dropdown */}
                  {insumoOpen && (
                    <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, zIndex:300,
                      background:"#13101e", border:"1.5px solid #4ade8066", borderRadius:10,
                      boxShadow:"0 8px 32px rgba(0,0,0,0.6)", overflow:"hidden" }}>
                      {/* Busca */}
                      <div style={{ padding:"8px 10px", borderBottom:"1px solid #2d2640" }}>
                        <input autoFocus value={insumoBusca}
                          onChange={e=>setInsumoBusca(e.target.value)}
                          onKeyDown={e=>{ if(e.key==="Escape") setInsumoOpen(false); }}
                          placeholder="🔍 Buscar insumo..."
                          style={{ width:"100%", background:"#0d0b15", border:"1px solid #2d2640",
                            borderRadius:6, padding:"5px 10px", color:"#f0e8ff",
                            fontSize:11, outline:"none", boxSizing:"border-box" }} />
                      </div>
                      {/* Lista */}
                      <div style={{ maxHeight:260, overflowY:"auto" }}>
                        {insumoFilt.length === 0
                          ? <div style={{ padding:"12px", color:"#4a3f60", fontSize:11, textAlign:"center" }}>
                              Nenhum insumo encontrado
                            </div>
                          : insumoFilt.map(i => (
                            <div key={i.cod}
                              onClick={()=>{ setForm(f=>({...f,insumo_cod:i.cod})); setInsumoOpen(false); setInsumoBusca(""); }}
                              style={{ padding:"8px 12px", fontSize:11, cursor:"pointer",
                                background: form.insumo_cod===i.cod?"#0a2e0a":"transparent",
                                color: form.insumo_cod===i.cod?"#4ade80":"#c8b8e8",
                                borderBottom:"1px solid #1e1a2e",
                                display:"flex", justifyContent:"space-between", alignItems:"center" }}
                              onMouseEnter={e=>e.currentTarget.style.background="#1a2e1a"}
                              onMouseLeave={e=>e.currentTarget.style.background=form.insumo_cod===i.cod?"#0a2e0a":"transparent"}>
                              <span>{i.nome}</span>
                              <span style={{ fontSize:9, color:"#6b5f80", marginLeft:8, flexShrink:0 }}>{i.unid}</span>
                            </div>
                          ))
                        }
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            <label style={{ fontSize:10, color:"#6b5f80", fontWeight:600, textTransform:"uppercase" }}>
              Qtd ({insumoSel?.unid||"—"})
            </label>
            <input type="number" step="0.001" min="0" value={form.quantidade}
              onChange={e=>{
                const q = e.target.value;
                setForm(f=>{
                  const tot = Number(String(f.total_pago).replace(",","."));
                  const qtd = Number(String(q).replace(",","."));
                  return { ...f, quantidade: q,
                    preco_unitario: modoEntrada==="total" && qtd>0 && tot>0
                      ? (tot/qtd).toFixed(4) : f.preco_unitario };
                });
              }}
              placeholder="0" style={{ ...selS, borderColor: form.quantidade?"#4ade80":"" }} />
          </div>

          {/* Modo de entrada: Unitário ou Total pago */}
          {modoEntrada === "unitario" ? (
            <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <label style={{ fontSize:10, color:"#6b5f80", fontWeight:600, textTransform:"uppercase" }}>
                  Preço / {insumoSel?.unid||"un"}
                </label>
                <button onClick={()=>setModoEntrada("total")}
                  style={{ fontSize:9, color:"#818cf8", background:"none", border:"none",
                    cursor:"pointer", padding:0, textDecoration:"underline" }}>
                  usar total pago →
                </button>
              </div>
              <input type="number" step="0.01" min="0" value={form.preco_unitario}
                onChange={e=>setForm(f=>({...f,preco_unitario:e.target.value}))}
                placeholder="0,00" style={{ ...selS, borderColor: form.preco_unitario?"#4ade80":"" }} />
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <label style={{ fontSize:10, color:"#f59e0b", fontWeight:600, textTransform:"uppercase" }}>
                  💰 Total pago (R$)
                </label>
                <button onClick={()=>setModoEntrada("unitario")}
                  style={{ fontSize:9, color:"#818cf8", background:"none", border:"none",
                    cursor:"pointer", padding:0, textDecoration:"underline" }}>
                  ← preço unitário
                </button>
              </div>
              <input type="number" step="0.01" min="0" value={form.total_pago}
                onChange={e=>{
                  const tot = e.target.value;
                  setForm(f=>{
                    const qtd = Number(String(f.quantidade).replace(",","."));
                    const totN = Number(String(tot).replace(",","."));
                    return { ...f, total_pago: tot,
                      preco_unitario: qtd>0 && totN>0 ? (totN/qtd).toFixed(4) : f.preco_unitario };
                  });
                }}
                placeholder="Ex: 64,95"
                style={{ ...selS, borderColor: form.total_pago?"#f59e0b":"" }} />
              {/* Preço unitário calculado */}
              {Number(form.quantidade)>0 && Number(form.total_pago)>0 && (
                <div style={{ fontSize:11, color:"#4ade80", fontWeight:700, marginTop:2 }}>
                  = R$ {(Number(String(form.total_pago).replace(",","."))/Number(String(form.quantidade).replace(",","."))).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:4})} / {insumoSel?.unid||"un"}
                </div>
              )}
            </div>
          )}
        </div>
        <div style={{ display:"grid", gridTemplateColumns: isMob?"1fr":"1fr 1fr", gap:8, marginBottom:8 }}>
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            <label style={{ fontSize:10, color:"#6b5f80", fontWeight:600, textTransform:"uppercase" }}>🏭 Fornecedor (opcional)</label>
            {/* Dropdown com busca + adicionar novo */}
            <div style={{ position:"relative" }}>
              <div onClick={()=>{ setFornecedorOpen(o=>!o); setFornecedorBusca(""); }}
                style={{ ...selS, display:"flex", alignItems:"center", justifyContent:"space-between",
                  cursor:"pointer", userSelect:"none", padding:"6px 10px",
                  borderColor: form.fornecedor?"#818cf8":"" }}>
                <span style={{ fontSize:12, color: form.fornecedor?"#c8b8e8":"#4a3f60",
                  overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                  {form.fornecedor || "Selecione ou adicione..."}
                </span>
                <span style={{ color:"#4a3f60", fontSize:10, flexShrink:0, marginLeft:6 }}>▼</span>
              </div>

              {fornecedorOpen && (
                <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, zIndex:300,
                  background:"#13101e", border:"1.5px solid #3730a3", borderRadius:10,
                  boxShadow:"0 8px 32px rgba(0,0,0,0.6)", overflow:"hidden" }}>

                  {/* Busca */}
                  <div style={{ padding:"8px 10px", borderBottom:"1px solid #2d2640" }}>
                    <input autoFocus value={fornecedorBusca}
                      onChange={e=>setFornecedorBusca(e.target.value)}
                      onKeyDown={e=>{ if(e.key==="Escape") setFornecedorOpen(false); }}
                      placeholder="🔍 Buscar fornecedor..."
                      style={{ width:"100%", background:"#0d0b15", border:"1px solid #2d2640",
                        borderRadius:6, padding:"5px 10px", color:"#f0e8ff",
                        fontSize:11, outline:"none", boxSizing:"border-box" }} />
                  </div>

                  {/* Lista */}
                  <div style={{ maxHeight:180, overflowY:"auto" }}>
                    {/* Opção limpar */}
                    {form.fornecedor && (
                      <div onClick={()=>{ setForm(f=>({...f,fornecedor:""})); setFornecedorOpen(false); }}
                        style={{ padding:"7px 12px", fontSize:11, color:"#6b5f80",
                          cursor:"pointer", borderBottom:"1px solid #1e1a2e",
                          fontStyle:"italic" }}>
                        ✕ Remover fornecedor
                      </div>
                    )}
                    {/* Fornecedores filtrados */}
                    {fornecedores
                      .filter(f => !fornecedorBusca || f.toLowerCase().includes(fornecedorBusca.toLowerCase()))
                      .map(nome => (
                        <div key={nome}
                          onClick={()=>{ setForm(f=>({...f,fornecedor:nome})); setFornecedorOpen(false); setFornecedorBusca(""); }}
                          style={{ padding:"8px 12px", fontSize:11, cursor:"pointer",
                            background: form.fornecedor===nome?"#1a1030":"transparent",
                            color: form.fornecedor===nome?"#c084fc":"#c8b8e8",
                            borderBottom:"1px solid #1e1a2e" }}
                          onMouseEnter={e=>e.currentTarget.style.background="#1a1030"}
                          onMouseLeave={e=>e.currentTarget.style.background=form.fornecedor===nome?"#1a1030":"transparent"}>
                          {nome}
                        </div>
                      ))
                    }
                    {/* Nenhum resultado + opção de adicionar */}
                    {fornecedorBusca.trim() && !fornecedores.some(f=>f.toLowerCase()===fornecedorBusca.toLowerCase()) && (
                      <div onClick={async ()=>{
                          const novo = fornecedorBusca.trim();
                          await salvarFornecedor(novo);
                          setForm(f=>({...f,fornecedor:novo}));
                          setFornecedorOpen(false);
                          setFornecedorBusca("");
                        }}
                        style={{ padding:"8px 12px", fontSize:11, cursor:"pointer",
                          color:"#4ade80", borderBottom:"1px solid #1e1a2e",

  const SB_URL_P = "https://wmlecjrkqwoejuryeayz.supabase.co/rest/v1";

  const SB_HP = { "Content-Type":"application/json","apikey":SB_KEY_P,"Authorization":"Bearer "+SB_KEY_P };

  // Rateio calculado automaticamente pela fórmula correta:
  // Rateio (%) = (Total Despesas Fixas ÷ Faturamento Médio Mensal) × 100
  const [rateioAutomatico, setRateioAutomatico] = useState(null);
  const [rateioInfo, setRateioInfo]             = useState(null); // { totalDF, mediaFat, meses }

  useEffect(() => {
    (async () => {
      try {
        // Fórmula da planilha: % Rateio = Despesas Fixas ÷ Faturamento Bruto × 100
        // Faturamento Bruto = faturamento do mês anterior (página Produtos Vendidos)

        // 1. Total das despesas fixas
        const rDF = await fetch(`${SB_URL_P}/despesas_fixas?select=valor`, { headers: SB_HP });
        if (!rDF.ok) return;
        const dfData = await rDF.json();
        const totalDF = Array.isArray(dfData) ? dfData.reduce((s, x) => s + Number(x.valor || 0), 0) : 0;
        if (totalDF === 0) return;

        // 2. Produtos com preço de venda
        const rP = await fetch(`${SB_URL_P}/catalogo_produtos?ativo=eq.true&select=id,preco_venda`, { headers: SB_HP });
        if (!rP.ok) return;
        const prods = await rP.json();
        const precoMap = {};
        (Array.isArray(prods) ? prods : []).forEach(p => { precoMap[p.id] = Number(p.preco_venda || 0); });

        // 3. Faturamento do mês anterior (igual à planilha: Faturamento Bruto)
        const hoje = new Date();
        const mesAnt = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1).toISOString().slice(0, 7);
        const rV = await fetch(
          `${SB_URL_P}/vendas_produtos?mes_referencia=eq.${mesAnt}&select=produto_id,quantidade`,
          { headers: SB_HP }
        );
        if (!rV.ok) return;
        const vendas = await rV.json();
        if (!Array.isArray(vendas) || vendas.length === 0) return;

        // 4. Faturamento Bruto = soma(quantidade × preço_venda) do mês anterior
        const mediaFat = vendas.reduce((s, v) => s + Number(v.quantidade || 0) * (precoMap[v.produto_id] || 0), 0);
        if (mediaFat === 0) return;

        // 5. % Rateio = (Despesas Fixas ÷ Faturamento Bruto) × 100
        const pctRateio = Math.round((totalDF / mediaFat) * 10000) / 100;

        setRateioAutomatico(pctRateio);
        setRateioInfo({ totalDF, mediaFat, meses: mesAnt });

  useEffect(() => {

    const rateioFixo = precoVenda * cfg.despFixasTotal / 100;
    const despVar    = impVal + taxMaqVal + taxAplVal + comissVal;
    const margContrib = precoVenda - custoVar - despVar;
    const lucroR      = margContrib - rateioFixo;
    const margemLucroP = precoVenda > 0 ? (lucroR / precoVenda * 100) : 0;
    const markup      = custoVar > 0 ? (precoVenda / (custoVar + despVar)) : 0;
