  { id:"maracuja",   label:"Maracujá",      cor:"#f9a825", borda:"#e65100"  },
  { id:"oreo",       label:"Oreo",          cor:"#1a1a1a", borda:"#333"     },
  { id:"brigadeiro", label:"Brigadeiro",    cor:"#3d1a00", borda:"#7c3a00"  },
  { id:"limao-rec",  label:"Limão",         cor:"#c8e56a", borda:"#7cb800"  },
];
const DECORACOES_DEF = [
  { id:"none",     label:"Sem decoração",  desc:"apenas cobertura",     precoExtra:0  },
  { id:"simples",  label:"Simples",        desc:"chantilly + frutas",   precoExtra:25 },
  { id:"elaborada",label:"Elaborada",      desc:"flores + personagem",  precoExtra:55 },
];

// ─── Mini SVG do bolo (ilustrativo, inline) ─────────────────────────────
function BoloSVG({ tamanho, massa, recheios, decoracao }) {
  const tam = TAMANHOS_DEF.find(t=>t.id===tamanho) || TAMANHOS_DEF[1];
  const mas = MASSAS_DEF.find(m=>m.id===massa) || MASSAS_DEF[0];
  const r1  = RECHEIOS_DEF.find(r=>r.id===recheios[0]);
  const r2  = RECHEIOS_DEF.find(r=>r.id===recheios[1]);
  const dec = DECORACOES_DEF.find(d=>d.id===decoracao) || DECORACOES_DEF[0];
  const layers = tamanho==="p"?2 : tamanho==="m"?3 : 4;
  const sc = tamanho==="p"? 0.72 : tamanho==="m"? 0.88 : 1.0;
  const W=280, H=290, cakeW=200*sc, layH=42*sc;
  const totalH = layH*layers;
  const bx = (W-cakeW)/2, by = H-55-totalH;
  const rx = cakeW/2;

  const makeLayers = () => {
    const out = [];
    for (let i=layers-1; i>=0; i--) {
      const y = by + i*layH;
      out.push(<rect key={`s${i}`} x={bx+cakeW-5} y={y+5} width={5} height={layH} fill="rgba(0,0,0,0.12)" rx={2}/>);
      out.push(<rect key={`l${i}`} x={bx} y={y} width={cakeW} height={layH} fill={mas.cor} rx={i===0?4:0}/>);
      if (i < layers-1) {
        const rc = i%2===0 ? (r1?.cor||"#fff8e7") : (r2?.cor||r1?.cor||"#fff8e7");
        out.push(<rect key={`f${i}`} x={bx+4} y={y-4} width={cakeW-8} height={9} fill={rc} rx={3}/>);
      }
      out.push(<rect key={`t${i}`} x={bx} y={y+layH-2} width={cakeW} height={2} fill="rgba(0,0,0,0.07)"/>);
    }
    return out;
  };

  const makeFrost = () => {
    const cy=by, cx=bx+rx;
    const drips=[0.1,0.26,0.44,0.6,0.76,0.9].map((p,i)=>(
      <rect key={i} x={bx+cakeW*p-4} y={cy} width={8} height={(15+Math.sin(i*1.8)*8)*sc} fill={mas.corClaro} rx={4}/>
    ));
    return (<><ellipse cx={cx} cy={cy} rx={rx} ry={10*sc} fill={mas.corClaro}/>{drips}<ellipse cx={cx} cy={cy} rx={rx*0.65} ry={6*sc} fill="rgba(255,255,255,0.22)"/></>);
  };

  const makeCandles = () => {
    const cx=bx+rx, cy=by, n=layers;
    const sp=20*sc, sx=cx-((n-1)*sp)/2;
    const cols=["#e91e63","#9c27b0","#ff9800","#4caf50"];
    return Array.from({length:n},(_,i)=>{
      const x=sx+i*sp;
      return (<g key={i}>
        <rect x={x-3*sc} y={cy-25*sc} width={6*sc} height={20*sc} fill={cols[i%4]} rx={2*sc}/>
        <ellipse cx={x} cy={cy-25*sc} rx={3*sc} ry={2*sc} fill="rgba(255,255,255,0.25)"/>
        <ellipse cx={x} cy={cy-33*sc} rx={2.5*sc} ry={4.5*sc} fill="#FF9800" opacity={0.9}>
          <animate attributeName="ry" values={`${4.5*sc};${6*sc};${4.5*sc}`} dur={`${1.1+i*0.25}s`} repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx={x} cy={cy-34*sc} rx={1.2*sc} ry={2.5*sc} fill="#FFEB3B" opacity={0.8}>
          <animate attributeName="ry" values={`${2.5*sc};${3.5*sc};${2.5*sc}`} dur={`${1.1+i*0.25}s`} repeatCount="indefinite"/>
        </ellipse>
      </g>);
    });
  };

  const makeDec = () => {
    if (dec.id==="none") return null;
    const cx=bx+rx, cy=by-12*sc;
    if (dec.id==="simples") {
      return (<g>{[[-28,-3],[2,-7],[26,-2]].map(([ox,oy],i)=>(
        <g key={i} transform={`translate(${cx+ox*sc},${cy+oy*sc})`}>
          {[0,60,120,180,240,300].map(a=>(
            <ellipse key={a} cx={Math.cos(a*Math.PI/180)*6*sc} cy={Math.sin(a*Math.PI/180)*6*sc}
              rx={4.5*sc} ry={2.5*sc} fill={["#e91e63","#f48fb1","#ff80ab"][i%3]} transform={`rotate(${a})`} opacity={0.9}/>
          ))}
          <circle cx={0} cy={0} r={4.5*sc} fill="#fff176"/>
        </g>
      ))}</g>);
    }
    if (dec.id==="elaborada") {
      return (<g>
        {[[-38,-5],[0,-15],[36,-3],[-18,-1],[20,-1]].map(([ox,oy],i)=>(
          <g key={i} transform={`translate(${cx+ox*sc},${cy+oy*sc})`}>
            {[0,45,90,135,180,225,270,315].map(a=>(
              <ellipse key={a} cx={Math.cos(a*Math.PI/180)*7*sc} cy={Math.sin(a*Math.PI/180)*7*sc}
                rx={5.5*sc} ry={3*sc} fill={["#9c27b0","#e91e63","#ff9800","#4caf50","#2196f3"][i%5]}
                transform={`rotate(${a})`} opacity={0.95}/>
            ))}
            <circle cx={0} cy={0} r={4*sc} fill="#fff9c4"/>
          </g>
        ))}
        <g transform={`translate(${cx},${cy-16*sc})`}>
          {[-22,-11,0,11,22].map((ox,i)=>(
            <polygon key={i} points={`${ox*sc},-${(i===2?18:13)*sc} ${(ox-6)*sc},0 ${(ox+6)*sc},0`}
              fill="#FFD700" stroke="#FFA000" strokeWidth={0.7}/>
          ))}
          <rect x={-30*sc} y={0} width={60*sc} height={7*sc} fill="#FFD700" stroke="#FFA000" strokeWidth={0.7} rx={2}/>
          {[-18,0,18].map((ox,i)=>(
            <circle key={i} cx={ox*sc} cy={0} r={3.5*sc} fill={["#e91e63","#9c27b0","#2196f3"][i]}/>
          ))}
        </g>
      </g>);
    }
    return null;
  };

  const plateCX=bx+rx, plateY=by+totalH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg" style={{width:"100%",height:"100%",transition:"all 0.35s cubic-bezier(.2,.8,.2,1)"}}>
      <defs>
        <radialGradient id="cbg" cx="50%" cy="60%" r="50%">
          <stop offset="0%" stopColor="#1e1040"/>
          <stop offset="100%" stopColor="#130f1e"/>
        </radialGradient>
        <filter id="cs"><feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="rgba(124,58,237,0.2)"/></filter>
      </defs>
      <rect width={W} height={H} fill="url(#cbg)" rx={16}/>
      <ellipse cx={plateCX} cy={plateY+7} rx={rx+16} ry={9} fill="rgba(0,0,0,0.15)"/>
      <ellipse cx={plateCX} cy={plateY} rx={rx+20} ry={11} fill="#1e1040" stroke="#3730a3" strokeWidth={1.5}/>
      <ellipse cx={plateCX} cy={plateY} rx={rx+9} ry={6} fill="rgba(124,58,237,0.2)"/>
      <g filter="url(#cs)">{makeLayers()}{makeFrost()}</g>
      {makeDec()}
      {makeCandles()}
    </svg>
  );
}

// ─── Formulário de bolo (criar/editar) ─────────────────────────────────
function BoloForm({ initial, onSave, onCancel }) {
  const empty = {
    nome:"", tamanhos:["m"], massas_disponiveis:["chocolate","baunilha"],
    recheios_disponiveis:["ninho","nutella","doce-leite"],
    decoracoes_disponiveis:["none","simples","elaborada"],
    precos_tamanho:{ p:65, m:95, g:139 }, preco_decoracao:{ none:0, simples:25, elaborada:55 },
    ativo:true, descricao:"", tempo_encomenda:3
  };

  return (
    <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>

      {/* Preview do bolo */}
      <div style={{width:220,flexShrink:0}}>
        <div style={{height:200,marginBottom:8}}>
          <BoloSVG tamanho={prev.tamanho} massa={prev.massa} recheios={prev.recheios} decoracao={prev.decoracao}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <div style={{fontSize:9,color:"#6b5f80",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700}}>Preview</div>
          {f.tamanhos.length>0 && (
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {f.tamanhos.map(t=>(
                <button key={t} onClick={()=>setPrev(p=>({...p,tamanho:t}))}
                  style={{fontSize:11,padding:"3px 10px",borderRadius:6,cursor:"pointer",
                    border:prev.tamanho===t?"1px solid #c084fc":"1px solid #2d2640",
                    background:prev.tamanho===t?"#2d1254":"none",color:prev.tamanho===t?"#e9d5ff":"#6b5f80"}}>
                  {TAMANHOS_DEF.find(x=>x.id===t)?.label||t}
                </button>
              ))}
            </div>
          )}
          {f.massas_disponiveis.length>0 && (
            <select value={prev.massa} onChange={e=>setPrev(p=>({...p,massa:e.target.value}))}
              style={{...iS,fontSize:11,padding:"4px 8px"}}>
              {f.massas_disponiveis.map(m=>(
                <option key={m} value={m}>{MASSAS_DEF.find(x=>x.id===m)?.label||m}</option>
              ))}
            </select>
          )}
          {f.decoracoes_disponiveis.length>0 && (
            <select value={prev.decoracao} onChange={e=>setPrev(p=>({...p,decoracao:e.target.value}))}
              style={{...iS,fontSize:11,padding:"4px 8px"}}>
              {f.decoracoes_disponiveis.map(d=>(
                <option key={d} value={d}>{DECORACOES_DEF.find(x=>x.id===d)?.label||d}</option>
              ))}
            </select>
          )}
        </div>
      </div>

      {/* Campos do formulário */}
      <div style={{flex:1,minWidth:280,display:"flex",flexDirection:"column",gap:12}}>

        {/* Nome e Descrição */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={{gridColumn:"1/-1"}}>
            <label style={{fontSize:10,color:"#8a7fa0",fontWeight:700,textTransform:"uppercase",display:"block",marginBottom:4}}>
              Nome do Bolo *
            </label>
            <input value={f.nome} onChange={e=>setF(p=>({...p,nome:e.target.value}))}
              placeholder="Ex: Bolo de Ninho Supreme" style={iS}/>
          </div>
          <div style={{gridColumn:"1/-1"}}>
            <label style={{fontSize:10,color:"#8a7fa0",fontWeight:700,textTransform:"uppercase",display:"block",marginBottom:4}}>
              Descrição curta
            </label>

              placeholder="Ex: Camadas de pão de ló com creme de ninho..." style={iS}/>
          </div>
          <div>
            <label style={{fontSize:10,color:"#8a7fa0",fontWeight:700,textTransform:"uppercase",display:"block",marginBottom:4}}>
              Encomenda com (dias)
            </label>
            <input type="number" min={1} max={30} value={f.tempo_encomenda}
              onChange={e=>setF(p=>({...p,tempo_encomenda:Number(e.target.value)||3}))} style={iS}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,paddingTop:20}}>

            📏 Tamanhos disponíveis + preços base

                  </span>
                </label>
                {f.tamanhos.includes(t.id) && (
                  <div style={{display:"flex",alignItems:"center",gap:4,flex:1}}>
                    <span style={{fontSize:11,color:"#6b5f80"}}>R$</span>
                    <input type="number" step={1} min={0}
                      value={f.precos_tamanho[t.id]??t.precoBase}
                      onChange={e=>setF(p=>({...p,precos_tamanho:{...p.precos_tamanho,[t.id]:Number(e.target.value)}}))}
                      style={{...iS,width:80,textAlign:"right",borderColor:"#3730a3"}}/>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>

        {/* Massas disponíveis */}
        <div style={{background:"#0d0b15",border:"1.5px solid #1a1628",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:10,color:"#f59e0b",fontWeight:800,textTransform:"uppercase",marginBottom:8}}>
            🍰 Massas disponíveis
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {MASSAS_DEF.map(m=>(
              <label key={m.id} style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",
                padding:"5px 10px",borderRadius:7,border:`1.5px solid ${f.massas_disponiveis.includes(m.id)?"#f59e0b":"#2d2640"}`,
                background:f.massas_disponiveis.includes(m.id)?"#1c1400":"none"}}>
                <input type="checkbox" checked={f.massas_disponiveis.includes(m.id)} onChange={()=>toggle("massas_disponiveis",m.id)}
                  style={{accentColor:"#f59e0b"}}/>
                <div style={{width:10,height:10,borderRadius:"50%",background:m.cor,border:"1.5px solid rgba(255,255,255,0.15)"}}/>
                <span style={{fontSize:12,color:f.massas_disponiveis.includes(m.id)?"#fde68a":"#6b5f80"}}>{m.label}</span>
              </label>
            ))}
          </div>
        </div>

        {/* Recheios disponíveis */}
        <div style={{background:"#0d0b15",border:"1.5px solid #1a1628",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:10,color:"#e879f9",fontWeight:800,textTransform:"uppercase",marginBottom:8}}>
            🍫 Recheios disponíveis (máx. 2 na encomenda)
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {RECHEIOS_DEF.map(r=>(
              <label key={r.id} style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",
                padding:"5px 10px",borderRadius:7,border:`1.5px solid ${f.recheios_disponiveis.includes(r.id)?"#e879f9":"#2d2640"}`,
                background:f.recheios_disponiveis.includes(r.id)?"#1a0020":"none"}}>
                <input type="checkbox" checked={f.recheios_disponiveis.includes(r.id)} onChange={()=>toggle("recheios_disponiveis",r.id)}
                  style={{accentColor:"#e879f9"}}/>
                <div style={{width:10,height:10,borderRadius:"50%",background:r.cor,border:`1.5px solid ${r.borda}`}}/>
                <span style={{fontSize:12,color:f.recheios_disponiveis.includes(r.id)?"#f0abfc":"#6b5f80"}}>{r.label}</span>
              </label>
            ))}

        </div>

        {/* Decorações + preços extra */}

          </div>

                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{fontSize:11,color:"#6b5f80"}}>+R$</span>
                    <input type="number" step={1} min={0}
                      value={f.preco_decoracao[d.id]??d.precoExtra}

        {/* Botões */}

              background:(!f.nome.trim()||f.tamanhos.length===0)?"#1a1628":"linear-gradient(135deg,#7c3aed,#6d28d9)",
              color:"#fff",cursor:"pointer",fontSize:13,fontWeight:700,
              opacity:(!f.nome.trim()||f.tamanhos.length===0)?0.5:1}}>
            💾 Salvar Bolo
          </button>
        </div>
      </div>
    </div>
  );
}

  return (
    <div style={{background:bolo.ativo?"#13101e":"#0d0b15",border:`1.5px solid ${bolo.ativo?"#2d2640":"#1a1628"}`,
      borderRadius:12,overflow:"hidden",opacity:bolo.ativo?1:0.6,transition:"all 0.2s"}}>

              background:bolo.ativo?"#0a2e0a":"#1a0a0a",color:bolo.ativo?"#4ade80":"#f87171",

            </span>
          </div>
          {bolo.descricao && <div style={{fontSize:11,color:"#6b5f80",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{bolo.descricao}</div>}
        </div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={onEdit} title="Editar" style={{fontSize:12,background:"none",border:"1px solid #2d2640",borderRadius:6,color:"#a78bfa",cursor:"pointer",padding:"3px 8px"}}>✏️</button>
          <button onClick={onToggle} title={bolo.ativo?"Desativar":"Ativar"} style={{fontSize:12,background:"none",border:"1px solid #2d2640",borderRadius:6,color:bolo.ativo?"#f59e0b":"#4ade80",cursor:"pointer",padding:"3px 8px"}}>{bolo.ativo?"⏸":"▶"}</button>
          <button onClick={onDelete} title="Excluir" style={{fontSize:12,background:"none",border:"1px solid #7f1d1d",borderRadius:6,color:"#f87171",cursor:"pointer",padding:"3px 8px"}}>🗑</button>
        </div>
      </div>

      {/* Pills: tamanhos | massas | recheios | decoração */}
      <div style={{padding:"0 14px 12px",display:"flex",flexDirection:"column",gap:5}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {bolo.tamanhos.map(t=>{
            const td=TAMANHOS_DEF.find(x=>x.id===t);
            return <span key={t} style={{fontSize:10,padding:"2px 8px",borderRadius:5,background:"#1a1030",color:"#c084fc",border:"1px solid #3d1c6e"}}>{td?.label||t} · {fmt(bolo.precos_tamanho?.[t]||0)}</span>;
          })}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
          <span style={{fontSize:9,color:"#6b5f80",marginRight:2}}>massa:</span>
          {bolo.massas_disponiveis.map(m=>{
            const md=MASSAS_DEF.find(x=>x.id===m);
            return <span key={m} style={{fontSize:10,padding:"1px 7px",borderRadius:4,background:"#1a1400",color:"#fde68a",border:"1px solid #f59e0b33"}}>{md?.label||m}</span>;
          })}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
          <span style={{fontSize:9,color:"#6b5f80",marginRight:2}}>recheio:</span>
          {bolo.recheios_disponiveis.map(r=>{
            const rd=RECHEIOS_DEF.find(x=>x.id===r);
            return <span key={r} style={{fontSize:10,padding:"1px 7px",borderRadius:4,background:"#1a0020",color:"#f0abfc",border:"1px solid #e879f933"}}>{rd?.label||r}</span>;
          })}
        </div>
        {bolo.decoracoes_disponiveis.length>0 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
            <span style={{fontSize:9,color:"#6b5f80",marginRight:2}}>decoração:</span>
            {bolo.decoracoes_disponiveis.map(d=>{
              const dd=DECORACOES_DEF.find(x=>x.id===d);
              return <span key={d} style={{fontSize:10,padding:"1px 7px",borderRadius:4,background:"#001a10",color:"#6ee7b7",border:"1px solid #34d39933"}}>{dd?.label||d}{bolo.preco_decoracao?.[d]>0?` +${fmt(bolo.preco_decoracao[d])}`:""}</span>;
            })}
          </div>
        )}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:2}}>
          <span style={{fontSize:11,color:"#4a3f60"}}>⏱ encomenda com {bolo.tempo_encomenda||3} dias</span>
          <span style={{fontSize:13,fontWeight:800,color:"#c084fc"}}>{faixaPreco}</span>
        </div>
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="react">
function CardapioBolosTab() {
  const [bolos,   setBolos]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal,   setModal]   = useState(null); // null | "novo" | { bolo }
  const [filtro,  setFiltro]  = useState("");
  const [status,  setStatus]  = useState("all"); // "all"|"ativo"|"inativo"
  const [toast,   setToast]   = useState(null);
  const [conf,    setConf]    = useState(null); // confirmação de exclusão

  const showToastB = (msg, tipo="ok") => { setToast({msg,tipo}); setTimeout(()=>setToast(null),3500); };

  // ── LOAD ──
  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try {
        const r = await fetch(`${SB_URL_CB}/cardapio_bolos?order=created_at`, { headers:SB_H_CB });
        if (r.ok) {
          const d = await r.json();
          setBolos(Array.isArray(d) ? d.map(b=>({
            ...b,
            tamanhos: b.tamanhos||["m"],
            massas_disponiveis: b.massas_disponiveis||["chocolate"],
            recheios_disponiveis: b.recheios_disponiveis||["ninho"],
            decoracoes_disponiveis: b.decoracoes_disponiveis||["none"],
            precos_tamanho: b.precos_tamanho||{ m:95 },
            preco_decoracao: b.preco_decoracao||{ none:0 },
          })) : []);
        }
      } catch(e) { console.error(e); }
      setLoading(false);
    })();
  },[]);

  // ── SAVE ──
  const salvarBolo = async (f) => {
    const payload = {
      nome: f.nome.trim(),
      descricao: f.descricao?.trim()||null,
      ativo: f.ativo,
      tempo_encomenda: f.tempo_encomenda||3,
      tamanhos: f.tamanhos,
      massas_disponiveis: f.massas_disponiveis,
      recheios_disponiveis: f.recheios_disponiveis,
      decoracoes_disponiveis: f.decoracoes_disponiveis,
      precos_tamanho: f.precos_tamanho,
      preco_decoracao: f.preco_decoracao,
    };
    try {
      if (f.id) {
        // PATCH
        const r = await fetch(`${SB_URL_CB}/cardapio_bolos?id=eq.${f.id}`, {
          method:"PATCH", headers:{...SB_H_CB,"Prefer":"return=representation"}, body:JSON.stringify(payload)
        });
        const d = await r.json();
        const updated = Array.isArray(d)&&d[0] ? d[0] : {...f,...payload};
        setBolos(prev=>prev.map(b=>b.id===f.id?{...b,...updated}:b));
        showToastB(`"${f.nome}" atualizado! ✅`);
      } else {
        // INSERT
        const r = await fetch(`${SB_URL_CB}/cardapio_bolos`, {
          method:"POST", headers:{...SB_H_CB,"Prefer":"return=representation"}, body:JSON.stringify(payload)
        });
        const d = await r.json();
        const novo = Array.isArray(d)&&d[0] ? {...d[0],...payload} : {...payload,id:Date.now()};
        setBolos(prev=>[...prev,novo]);
        showToastB(`"${f.nome}" cadastrado! 🎂`);
      }
    } catch(e) {
      // Salva local como fallback
      if (f.id) {
        setBolos(prev=>prev.map(b=>b.id===f.id?{...b,...payload}:b));
      } else {
        setBolos(prev=>[...prev,{...payload,id:Date.now()}]);
      }
      showToastB(`Salvo localmente (sem conexão)`, "warn");
    }
    setModal(null);
  };

  const toggleAtivo = async (bolo) => {
    const novoAtivo = !bolo.ativo;
    try {
      await fetch(`${SB_URL_CB}/cardapio_bolos?id=eq.${bolo.id}`, {
        method:"PATCH", headers:{...SB_H_CB,"Prefer":"return=minimal"}, body:JSON.stringify({ativo:novoAtivo})
      });
    } catch(e) {}
    setBolos(prev=>prev.map(b=>b.id===bolo.id?{...b,ativo:novoAtivo}:b));
    showToastB(`"${bolo.nome}" ${novoAtivo?"ativado":"desativado"}`);
  };

  const excluirBolo = async (bolo) => {
    try {
      await fetch(`${SB_URL_CB}/cardapio_bolos?id=eq.${bolo.id}`, {method:"DELETE",headers:SB_H_CB});
    } catch(e){}
    setBolos(prev=>prev.filter(b=>b.id!==bolo.id));
    showToastB(`"${bolo.nome}" excluído.`,"del");
    setConf(null);
  };

  const filtrados = bolos.filter(b=>{
    if (status==="ativo"   && !b.ativo) return false;
    if (status==="inativo" &&  b.ativo) return false;
    if (filtro && !b.nome.toLowerCase().includes(filtro.toLowerCase())) return false;
    return true;
  });

  const ativos   = bolos.filter(b=>b.ativo).length;
  const inativos = bolos.length - ativos;

  const iS2 = { padding:"7px 10px", borderRadius:8, border:"1.5px solid #2d2640", background:"#0d0b15", color:"#f0e8ff", fontSize:12, outline:"none" };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>

      {/* Toast */}
      {toast && (
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",
          background:toast.tipo==="del"?"#431407":toast.tipo==="warn"?"#1c1400":"#14532d",
          color:"#fff",padding:"10px 24px",borderRadius:10,fontSize:13,fontWeight:600,
          zIndex:9999,boxShadow:"0 4px 24px rgba(0,0,0,0.7)",maxWidth:"90vw",textAlign:"center"}}>
          {toast.msg}
        </div>
      )}

      {/* Header */}
      <div style={{background:"#13101e",border:"1.5px solid #2d2640",borderRadius:12,padding:"14px 18px",
        display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:15,fontWeight:800,color:"#c084fc",marginBottom:2}}>🎂 Cardápio de Bolos</div>
          <div style={{fontSize:11,color:"#6b5f80"}}>
            <span style={{color:"#4ade80",fontWeight:700}}>{ativos}</span> ativos ·{" "}
            <span style={{color:"#f87171",fontWeight:700}}>{inativos}</span> inativos ·{" "}
            {bolos.length} total
          </div>
        </div>
        <button onClick={()=>setModal("novo")}
          style={{padding:"9px 20px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#7c3aed,#6d28d9)",
            color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer"}}>
          + Novo Bolo
        </button>
      </div>

      {/* Filtros */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <input value={filtro} onChange={e=>setFiltro(e.target.value)}
          placeholder="🔍 Buscar por nome..."
          style={{...iS2,flex:1,minWidth:180,borderColor:filtro?"#7c3aed":""}}/>
        {["all","ativo","inativo"].map(s=>(
          <button key={s} onClick={()=>setStatus(s)}
            style={{padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",
              background:status===s?"#7c3aed":"none",
              border:status===s?"none":"1.5px solid #2d2640",
              color:status===s?"#fff":"#6b5f80"}}>
            {s==="all"?"Todos":s==="ativo"?"Ativos":"Inativos"}
          </button>
        ))}
      </div>

      {/* Lista */}
      {loading ? (
        <div style={{textAlign:"center",padding:48,color:"#6b5f80",fontSize:13}}>⏳ Carregando cardápio...</div>
      ) : filtrados.length===0 ? (
        <div style={{background:"#13101e",border:"1.5px solid #2d2640",borderRadius:12,padding:48,textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:10}}>🎂</div>
          <div style={{fontSize:14,color:"#6b5f80",fontWeight:600}}>
            {bolos.length===0 ? "Nenhum bolo cadastrado ainda." : "Nenhum bolo encontrado com esse filtro."}
          </div>
          {bolos.length===0 && (
            <button onClick={()=>setModal("novo")}
              style={{marginTop:16,padding:"8px 22px",borderRadius:8,border:"1px solid #7c3aed",
                background:"#1a1030",color:"#c084fc",fontWeight:700,fontSize:13,cursor:"pointer"}}>
              + Cadastrar primeiro bolo
            </button>
          )}
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:10}}>
          {filtrados.map(b=>(
            <BoloCard key={b.id} bolo={b}
              onEdit={()=>setModal({bolo:b})}
              onToggle={()=>toggleAtivo(b)}
              onDelete={()=>setConf(b)}/>
          ))}
        </div>
      )}

      {/* Modal criar/editar */}
      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:200,
          display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}}
          onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div style={{background:"#13101e",border:"1.5px solid #7c3aed",borderRadius:16,
            padding:24,width:"100%",maxWidth:860,marginTop:16,marginBottom:32}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{margin:0,color:"#e9d5ff",fontSize:16,fontWeight:800}}>
                {modal==="novo" ? "🎂 Novo Bolo" : `✏️ Editar: ${modal.bolo.nome}`}
              </h3>
              <button onClick={()=>setModal(null)} style={{background:"none",border:"none",color:"#8a7fa0",fontSize:22,cursor:"pointer"}}>✕</button>
            </div>
            <BoloForm
              initial={modal==="novo" ? null : modal.bolo}
              onSave={salvarBolo}
              onCancel={()=>setModal(null)}/>
          </div>
        </div>
      )}

      {/* Modal confirmar exclusão */}
      {conf && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:300,
          display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
          onClick={()=>setConf(null)}>
          <div style={{background:"#13101e",border:"1.5px solid #7f1d1d",borderRadius:14,
            padding:24,width:"100%",maxWidth:360,textAlign:"center"}}
            onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:28,marginBottom:8}}>🗑</div>
            <div style={{fontSize:14,fontWeight:800,color:"#f87171",marginBottom:6}}>Excluir bolo?</div>
            <div style={{fontSize:12,color:"#c8b8e8",marginBottom:4}}><strong>{conf.nome}</strong></div>
            <div style={{fontSize:11,color:"#6b5f80",marginBottom:20}}>Esta ação não pode ser desfeita.</div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setConf(null)}
                style={{flex:1,padding:10,borderRadius:8,border:"1px solid #2d2640",background:"none",color:"#8a7fa0",cursor:"pointer",fontWeight:600,fontSize:12}}>
                Cancelar
              </button>
              <button onClick={()=>excluirBolo(conf)}
                style={{flex:1,padding:10,borderRadius:8,border:"none",background:"linear-gradient(135deg,#ef4444,#dc2626)",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>
                Sim, excluir
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

}

function SectionCard({ title, color, icon, children }) {
  const ac = color || "#c084fc";
  return (
    <div style={{background:"#13101e",border:"1.5px solid #2d2640",borderRadius:12,overflow:"hidden"}}>

function Toggle({ checked, onChange, color="#7c3aed" }) {

      style={{width:38,height:22,borderRadius:11,cursor:"pointer",flexShrink:0,

      <div style={{position:"absolute",top:3,left:checked?18:3,width:16,height:16,
        borderRadius:"50%",background:"#fff",transition:"left 0.2s",

}

// ── Card de sabor (massa ou recheio) com edição inline ────────────────
function SaborCard({ item, accentColor, onToggle, onUpdate, onDelete, tipo }) {
  const [editando, setEditando] = useState(false);
  const [draft,    setDraft]    = useState(item);

  // Paleta de cores rápidas
  const CORES_RAPIDAS = [
    "#5c2a0e","#f5deb3","#8B0000","#b5cc3e","#d97706",
    "#fdf5e6","#6b3a2a","#c8860a","#e91e63","#f9a825",
    "#1a1a1a","#3d1a00","#c8e56a","#7c3aed","#2196f3",
    "#4caf50","#ff9800","#9c27b0","#00bcd4","#ff5722",
    "#795548","#607d8b","#e91e63","#ffeb3b","#8bc34a",
  ];

  const iS = {padding:"5px 9px",borderRadius:7,border:"1.5px solid #2d2640",
    background:"#0d0b15",color:"#f0e8ff",fontSize:12,outline:"none",width:"100%"};

  const salvarDraft = () => {
    if (!draft.label.trim()) return;
    onUpdate(draft);
    setEditando(false);
  };

  return (
    <div style={{
      borderRadius:10, overflow:"hidden",
      border:`1.5px solid ${item.ativo ? accentColor+"66" : "#1a1628"}`,
      background: item.ativo ? `color-mix(in srgb,${accentColor} 5%,#0d0b15)` : "#0d0b15",
      opacity: item.ativo ? 1 : 0.55,
      transition:"all 0.2s",
    }}>
      {/* Linha principal */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px"}}>
        <Toggle checked={item.ativo} onChange={onToggle} color={accentColor}/>

        {/* Swatch de cor */}
        <div style={{
          width:22,height:22,borderRadius:"50%",flexShrink:0,
          background: item.cor || "#888",
          border:"2px solid rgba(255,255,255,0.15)",
          boxShadow: item.ativo ? `0 0 8px ${item.cor}88` : "none",
        }}/>

        {/* Nome + emoji */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:700,
            color:item.ativo?"#f0e8ff":"#4a3f60",
            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {item.emoji} {item.label}
          </div>
        </div>

        {/* Botões */}
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={()=>{setDraft({...item});setEditando(v=>!v);}}
            style={{fontSize:10,padding:"3px 9px",borderRadius:6,cursor:"pointer",
              border:`1px solid ${editando?"#4a3f60":accentColor+"66"}`,
              background:editando?"none":`color-mix(in srgb,${accentColor} 12%,#0d0b15)`,
              color:editando?"#6b5f80":accentColor,fontWeight:700}}>
            {editando?"✕":"✏️"}
          </button>
          {!item._builtin && (
            <button onClick={onDelete}
              style={{fontSize:10,padding:"3px 8px",borderRadius:6,cursor:"pointer",
                border:"1px solid #7f1d1d",background:"none",color:"#f87171",fontWeight:700}}>
              🗑
            </button>
          )}
        </div>
      </div>

      {/* Painel de edição */}
      {editando && (
        <div style={{borderTop:"1px solid #1e1a2e",padding:"14px 14px 12px",
          background:"color-mix(in srgb,#000 40%,#0d0b15)",

              <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>

                <input type="color" value={draft.cor}

                  style={{width:32,height:24,padding:0,border:"none",borderRadius:4,
                    background:"none",cursor:"pointer"}}/>
                <input value={draft.cor} onChange={e=>setDraft(d=>({...d,cor:e.target.value}))}
                  style={{...iS,width:88,fontFamily:"monospace",fontSize:11}} maxLength={7} placeholder="#000000"/>
              </div>
            </div>
            {/* Paleta rápida */}
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {CORES_RAPIDAS.map(c=>(
                <div key={c} onClick={()=>setDraft(d=>({...d,cor:c}))}
                  title={c}
                  style={{width:20,height:20,borderRadius:"50%",background:c,
                    cursor:"pointer",flexShrink:0,
                    border:`2px solid ${draft.cor===c?"#fff":"rgba(255,255,255,0.1)"}`,
                    boxShadow:draft.cor===c?"0 0 0 2px "+accentColor:"none",
                    transition:"all 0.1s"}}/>
              ))}
            </div>
          </div>

          {/* Botão aplicar */}
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setEditando(false)}
              style={{padding:"6px 14px",borderRadius:7,border:"1px solid #2d2640",
                background:"none",color:"#6b5f80",fontSize:12,cursor:"pointer"}}>
              Cancelar
            </button>
            <button onClick={salvarDraft}
              style={{padding:"6px 18px",borderRadius:7,border:"none",
                background:accentColor,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              ✓ Aplicar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Componente principal ──────────────────────────────────────────────
function ConfiguradorBolosTab() {
  const [cfg,     setCfg]     = useState(CFG_DEFAULT);
  const [loading, setLoading] = useState(true);
  const [saving,  setSaving]  = useState(false);
  const [saved,   setSaved]   = useState(false);
  const [toast,   setToast]   = useState(null);
  const [editTam, setEditTam] = useState({});
  const [editDec, setEditDec] = useState({});
  const [novoModal, setNovoModal] = useState(null); // "massa" | "recheio" | null

  const showToast = (msg, tipo="ok") => {
    setToast({msg,tipo});
    setTimeout(()=>setToast(null),3000);
  };

  // ── LOAD ────────────────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      try {
        const r = await fetch(
          `${SB_URL_CFG}/config?key=eq.${CFG_KEY}&select=value`,
          {headers:SB_H_CFG}
        );
        if(r.ok){
          const d = await r.json();
          if(Array.isArray(d)&&d.length>0&&d[0].value){
            const loaded = JSON.parse(d[0].value);
            setCfg(prev=>({
              tamanhos:   loaded.tamanhos   || prev.tamanhos,
              massas:     loaded.massas     || prev.massas,
              recheios:   loaded.recheios   || prev.recheios,
              decoracoes: loaded.decoracoes || prev.decoracoes,
            }));
          }
        }
      } catch(e){ console.warn("Config padrão."); }
      setLoading(false);
    })();
  },[]);

  // ── SAVE ────────────────────────────────────────────────────────────
  const salvar = async () => {
    setSaving(true);
    try {
      await fetch(`${SB_URL_CFG}/config`,{
        method:"POST",
        headers:{...SB_H_CFG,"Prefer":"resolution=merge-duplicates"},
        body:JSON.stringify({key:CFG_KEY,value:JSON.stringify(cfg)}),
      });
      setSaved(true);
      setTimeout(()=>setSaved(false),2500);
      showToast("✅ Salvo! O site atualiza em segundos.");
    } catch(e){
      showToast("❌ Erro ao salvar. Tente novamente.","err");
    }
    setSaving(false);
  };

  // ── HELPERS — Tamanho ────────────────────────────────────────────────
  const setTamField = (id,field,val) =>
    setCfg(p=>({...p,tamanhos:p.tamanhos.map(t=>t.id===id?{...t,[field]:val}:t)}));

  // ── HELPERS — Massas ─────────────────────────────────────────────────
  const toggleMassa  = id => setCfg(p=>({...p,massas:p.massas.map(m=>m.id===id?{...m,ativo:!m.ativo}:m)}));
  const updateMassa  = (id,draft) => setCfg(p=>({...p,massas:p.massas.map(m=>m.id===id?{...m,...draft}:m)}));
  const deleteMassa  = id => setCfg(p=>({...p,massas:p.massas.filter(m=>m.id!==id)}));
  const addTamanho   = form => {
    const novo = {id:gerarId("tam"),label:form.label.trim(),fatias:form.fatias,preco:form.preco,ativo:true};
    setCfg(p=>({...p,tamanhos:[...p.tamanhos,novo]}));
    setNovoModal(null);
    showToast(`"Bolo ${novo.label}" adicionado! 📏`);
  };

  const addMassa     = form => {
    const novo = {id:gerarId("massa"),label:form.label.trim(),emoji:form.emoji,cor:form.cor,ativo:true};
    setCfg(p=>({...p,massas:[...p.massas,novo]}));
    setNovoModal(null);
    showToast(`"${novo.label}" adicionada às massas! 🎂`);
  };

  // ── HELPERS — Recheios ───────────────────────────────────────────────
  const toggleRecheio = id => setCfg(p=>({...p,recheios:p.recheios.map(r=>r.id===id?{...r,ativo:!r.ativo}:r)}));
  const updateRecheio = (id,draft) => setCfg(p=>({...p,recheios:p.recheios.map(r=>r.id===id?{...r,...draft}:r)}));
  const deleteRecheio = id => setCfg(p=>({...p,recheios:p.recheios.filter(r=>r.id!==id)}));
  const addRecheio    = form => {
    const novo = {id:gerarId("recheio"),label:form.label.trim(),emoji:form.emoji,cor:form.cor,ativo:true};
    setCfg(p=>({...p,recheios:[...p.recheios,novo]}));
    setNovoModal(null);
    showToast(`"${novo.label}" adicionado aos recheios! 🍫`);
  };

  // ── HELPERS — Decorações ─────────────────────────────────────────────
  const toggleDec = id => setCfg(p=>({...p,decoracoes:p.decoracoes.map(d=>d.id===id?{...d,ativo:!d.ativo}:d)}));
  const setDecField=(id,f,v)=>setCfg(p=>({...p,decoracoes:p.decoracoes.map(d=>d.id===id?{...d,[f]:v}:d)}));

  const iS = {padding:"6px 10px",borderRadius:8,border:"1.5px solid #2d2640",
    background:"#0d0b15",color:"#f0e8ff",fontSize:13,outline:"none"};

  const ativosCount = arr => arr.filter(x=>x.ativo).length;

  if(loading) return (
    <div style={{textAlign:"center",padding:64,color:"#6b5f80"}}>
      <div style={{fontSize:32,marginBottom:8}}>⚙️</div>
      <div>Carregando configurações...</div>
    </div>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* Toast */}
      {toast&&(
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",
          background:toast.tipo==="err"?"#7f1d1d":"#14532d",
          color:"#fff",padding:"11px 28px",borderRadius:10,fontSize:13,fontWeight:600,
          zIndex:9999,boxShadow:"0 4px 24px rgba(0,0,0,0.7)",maxWidth:"90vw",textAlign:"center"}}>
          {toast.msg}
        </div>
      )}

      {/* Modal novo sabor */}
      {novoModal==="tamanho"&&(
        <NovoTamanhoModal onAdd={addTamanho} onClose={()=>setNovoModal(null)}/>
      )}
      {novoModal==="massa"&&(
        <NovoSaborModal tipo="massa" accentColor="#f59e0b" onAdd={addMassa} onClose={()=>setNovoModal(null)}/>
      )}
      {novoModal==="recheio"&&(
        <NovoSaborModal tipo="recheio" accentColor="#e879f9" onAdd={addRecheio} onClose={()=>setNovoModal(null)}/>
      )}

      {/* Header */}
      <div style={{background:"#13101e",border:"1.5px solid #2d2640",borderRadius:12,
        padding:"16px 20px",display:"flex",justifyContent:"space-between",
        alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontSize:16,fontWeight:800,color:"#c084fc",marginBottom:3}}>
            ⚙️ Configurador — Monte seu Bolo
          </div>
          <div style={{fontSize:11,color:"#6b5f80"}}>
            Edite nome, cor e emoji · ative ou desative opções · as alterações refletem no site ao salvar
          </div>
        </div>
        <button onClick={salvar} disabled={saving} style={{
          padding:"10px 28px",borderRadius:9,border:"none",cursor:"pointer",
          fontWeight:800,fontSize:13,minWidth:160,transition:"background 0.3s",
          background:saved?"linear-gradient(135deg,#22c55e,#16a34a)":"linear-gradient(135deg,#7c3aed,#6d28d9)",
          color:"#fff",opacity:saving?0.6:1}}>
          {saving?"Salvando...":saved?"✓ Salvo!":"💾 Salvar no site"}
        </button>
      </div>

      {/* ── 1. TAMANHOS ─────────────────────────────────────────────── */}
      <SectionCard title="Tamanhos disponíveis" icon="📏" color="#818cf8">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontSize:11,color:"#6b5f80"}}>
            Ative os tamanhos e ajuste fatias e preço base. Adicione quantos quiser.
          </div>
          <button onClick={()=>setNovoModal("tamanho")}
            style={{padding:"7px 16px",borderRadius:8,border:"1.5px solid #3730a3",
              background:"#1e1b4b",color:"#c7d2fe",fontWeight:700,fontSize:12,cursor:"pointer",
              display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>
            + Novo tamanho
          </button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {cfg.tamanhos.map(t=>{
            const isEdit = !!editTam[t.id];
            const draft  = editTam[t.id]||t;
            return (
              <div key={t.id} style={{
                background:"#0d0b15",
                border:`1.5px solid ${t.ativo?"#3730a3":"#1a1628"}`,
                borderRadius:10,overflow:"hidden",opacity:t.ativo?1:0.55,transition:"all 0.2s"}}>
                <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px"}}>
                  <Toggle checked={t.ativo} onChange={()=>setTamField(t.id,"ativo",!t.ativo)} color="#818cf8"/>
                  <div style={{width:40,height:40,borderRadius:8,flexShrink:0,
                    background:t.ativo?"linear-gradient(135deg,#1e1b4b,#3730a3)":"#1a1628",
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <span style={{fontSize:18,fontWeight:900,color:t.ativo?"#c7d2fe":"#4a3f60"}}>{t.label}</span>

                    <div style={{fontSize:13,fontWeight:700,color:t.ativo?"#e9d5ff":"#4a3f60"}}>Bolo {t.label}</div>

                      if(isEdit){setEditTam(e=>{const n={...e};delete n[t.id];return n;});}

        <button onClick={salvar} disabled={saving} style={{
          padding:"12px 36px",borderRadius:10,border:"none",cursor:"pointer",
          fontWeight:800,fontSize:14,transition:"background 0.3s",
          background:saved?"linear-gradient(135deg,#22c55e,#16a34a)":"linear-gradient(135deg,#7c3aed,#6d28d9)",

          {saving?"Salvando...":saved?"✓ Configurações salvas!":"💾 Salvar configurações no site"}
        </button>
      </div>
    </div>
  );
}

function HeroImageUploader({ value, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [uploadErr, setUploadErr] = useState("");
  const SB_STOR = "https://wmlecjrkqwoejuryeayz.supabase.co/storage/v1/object";
  const SB_K    = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbGVjanJrcXdvZWp1cnllYXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgyMDYsImV4cCI6MjA5MTMyNDIwNn0.SAYFGBZFjvLn9jIEs8J5mR93ZY7HlYQbT43YTn8JKnI";

  const upload = async (file) => {
    if (!file) return;
    setUploading(true); setUploadErr("");
    try {
      const ext  = file.name.split('.').pop().toLowerCase();
      const nome = "hero-banner-" + Date.now() + "." + ext;
      const r = await fetch(SB_STOR + "/site-assets/" + nome, {
        method: "POST",
        headers: {
          "apikey": SB_K, "Authorization": "Bearer " + SB_K,
          "Content-Type": file.type, "x-upsert": "true"
        },
        body: file,
      });
      if (r.ok) {
        onChange("https://wmlecjrkqwoejuryeayz.supabase.co/storage/v1/object/public/site-assets/" + nome);
      } else {
        const txt = await r.text();
        setUploadErr(txt.includes("Bucket not found")
          ? "Bucket não criado — rode o SQL criar_bucket_site_assets.sql no Supabase"
          : "Erro ao enviar: " + txt);
      }
    } catch(e) { setUploadErr("Erro de conexão: " + e.message); }
    setUploading(false);
  };

  const url = value && !value.startsWith("data:") ? value : "";

  return (
    <div style={{marginTop:4,background:"#0d0b15",border:"1.5px solid #2d2640",borderRadius:10,padding:"14px 16px"}}>
      <div style={{fontSize:10,color:"#c084fc",fontWeight:800,textTransform:"uppercase",

      <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:14,alignItems:"flex-start"}}>

          {url
            ? <img src={url} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""
                onError={e=>{e.target.style.display="none";}}/>
            : <div style={{textAlign:"center"}}>
                <div style={{fontSize:24}}>🌙</div>
                <div style={{fontSize:9,color:"#4a3f60",marginTop:2}}>sem foto</div>
              </div>
          }
        </div>
        {/* Controles */}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <label style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px",
            borderRadius:8,border:"1.5px solid #7c3aed",background:"#1a0a3d",

            opacity:uploading?0.6:1}}>

            placeholder="https://..."

function SiteSection({ icon, title, color, children, defaultOpen=false, secao, visivel, onToggleVisivel }) {
  const [open, setOpen] = useState(defaultOpen);
  const isVisible = visivel === undefined ? true : visivel;
  return (
    <div style={{ background:"#13101e",
      border:`1.5px solid ${open ? color+"55" : isVisible ? "#2d2640" : "#3d0000"}`,
      borderRadius:12, overflow:"hidden", transition:"all 0.2s",
      opacity: isVisible ? 1 : 0.6 }}>
      <div style={{
        display:"flex", alignItems:"center", gap:0,
        background: open ? `linear-gradient(90deg,color-mix(in srgb,${color} 10%,#13101e),#13101e)` : "none",
      }}>
        {/* Toggle visibilidade */}
        {secao && onToggleVisivel && (
          <div style={{padding:"0 0 0 14px", flexShrink:0}}
            onClick={e=>{e.stopPropagation();onToggleVisivel(secao,!isVisible);}}>
            <div title={isVisible?"Esconder no site":"Mostrar no site"}
              style={{
                width:44, height:44, display:"flex", alignItems:"center",
                justifyContent:"center", cursor:"pointer", borderRadius:8,
                fontSize:18, transition:"all 0.15s",
              }}>
              {isVisible ? "👁" : "🙈"}
            </div>
          </div>
        )}
        <button onClick={()=>setOpen(v=>!v)} style={{
          flex:1, display:"flex", alignItems:"center", gap:10,
          padding:"14px 18px", background:"none", border:"none", cursor:"pointer",
          textAlign:"left",
        }}>
          <span style={{fontSize:20}}>{icon}</span>
          <span style={{fontWeight:800, fontSize:14, color: isVisible?"#f0e8ff":"#6b5f80", flex:1}}>
            {title}
            {!isVisible && (
              <span style={{marginLeft:8,fontSize:10,fontWeight:700,
                background:"#3d0000",color:"#f87171",padding:"2px 8px",
                borderRadius:99,letterSpacing:"0.08em"}}>OCULTO</span>
            )}
          </span>
          <span style={{color:"#6b5f80", fontSize:18, transition:"transform 0.2s", marginRight:4,
            transform: open ? "rotate(180deg)" : "rotate(0deg)"}}>⌄</span>
        </button>
      </div>
      {open && (
        <div style={{padding:"0 18px 18px", borderTop:`1px solid ${color}22`}}>
          {children}
        </div>
      )}
    </div>
  );
}

function Field({ label, value, onChange, multiline=false, placeholder="", hint="" }) {
  const iS = {
    width:"100%", padding:"8px 12px", borderRadius:8,
    border:"1.5px solid #2d2640", background:"#0d0b15",
    color:"#f0e8ff", fontSize:13, outline:"none",
    fontFamily:"inherit", resize: multiline ? "vertical" : "none",
    minHeight: multiline ? 80 : "auto", lineHeight:1.5,
    transition:"border-color 0.15s",
  };
  return (
    <div style={{marginBottom:12}}>
      <div style={{fontSize:10, color:"#6b5f80", fontWeight:700,
        textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4}}>
        {label}
        {hint && <span style={{fontWeight:400, textTransform:"none", letterSpacing:0, marginLeft:6, color:"#4a3f60"}}>{hint}</span>}
      </div>
      {multiline
        ? <textarea value={value} onChange={e=>onChange(e.target.value)}
            placeholder={placeholder} style={iS} rows={3}/>
        : <input value={value} onChange={e=>onChange(e.target.value)}
            placeholder={placeholder} style={iS}/>
      }
    </div>
  );
}

function LinkField({ label, labelVal, hrefVal, onLabelChange, onHrefChange, icon="" }) {
  return (
    <div style={{ background:"#0d0b15", border:"1px solid #1e1a2e",
      borderRadius:8, padding:"10px 12px", marginBottom:8 }}>
      <div style={{fontSize:10, color:"#6b5f80", fontWeight:700,
        textTransform:"uppercase", marginBottom:6}}>{label}</div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
        <div>
          <div style={{fontSize:9,color:"#4a3f60",marginBottom:3}}>Texto exibido</div>
          <input value={labelVal} onChange={e=>onLabelChange(e.target.value)}
            style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #2d2640",
              background:"#13101e",color:"#f0e8ff",fontSize:12,outline:"none"}}/>
        </div>
        <div>
          <div style={{fontSize:9,color:"#4a3f60",marginBottom:3}}>Link (URL ou #ancora)</div>
          <input value={hrefVal} onChange={e=>onHrefChange(e.target.value)}
            placeholder="https:// ou #secao"
            style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #2d2640",
              background:"#13101e",color:"#f0e8ff",fontSize:12,outline:"none"}}/>
        </div>
      </div>
    </div>
  );
}

// ── TAB PRINCIPAL ─────────────────────────────────────────────────────
function SiteTab() {
  const [site,    setSite]    = useState(SITE_DEFAULT);
  const [loading, setLoading] = useState(true);
  const [saving,  setSaving]  = useState(false);
  const [saved,   setSaved]   = useState(false);
  const [toast,   setToast]   = useState(null);

  const showToast = (msg, tipo="ok") => {
    setToast({msg,tipo});
    setTimeout(()=>setToast(null), 3500);
  };

  // ── LOAD ────────────────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      try {
        const r = await fetch(
          `${SB_URL_SITE}/config?key=eq.${SITE_KEY}&select=value`,
          { headers: SB_H_SITE }
        );
        if(r.ok){
          const d = await r.json();
          if(Array.isArray(d) && d.length>0 && d[0].value){
            const loaded = JSON.parse(d[0].value);
            // deep merge para não perder campos novos
            setSite(prev => ({
              pagina:  { ...prev.pagina,  ...(loaded.pagina  || {}) },
              visivel: { ...prev.visivel, ...(loaded.visivel || {}) },
              nav:    { ...prev.nav,    ...(loaded.nav    || {}) },
              hero:   { ...prev.hero,   ...(loaded.hero   || {}) },
              bolos:  { ...prev.bolos,  ...(loaded.bolos  || {}) },
              steps:  { ...prev.steps,  ...(loaded.steps  || {}),
                passos: loaded.steps?.passos || prev.steps.passos },
              quote:  { ...prev.quote,  ...(loaded.quote  || {}) },
              footer: { ...prev.footer, ...(loaded.footer || {}),
                links_pedir: loaded.footer?.links_pedir || prev.footer.links_pedir,
                links_marca: loaded.footer?.links_marca || prev.footer.links_marca,
                horarios:    loaded.footer?.horarios    || (loaded.footer?.horario ? [{label:loaded.footer.horario}] : prev.footer.horarios),
              },
            }));
          }
        }
      } catch(e){ console.warn("Site content: usando padrão"); }
      setLoading(false);
    })();
  },[]);

  // ── SAVE ────────────────────────────────────────────────────────────
  const salvar = async () => {
    setSaving(true);
    try {
      await fetch(`${SB_URL_SITE}/config`, {
        method:"POST",
        headers: { ...SB_H_SITE, "Prefer":"resolution=merge-duplicates" },
        body: JSON.stringify({ key: SITE_KEY, value: JSON.stringify(site) }),
      });
      setSaved(true);
      setTimeout(()=>setSaved(false), 2500);
      showToast("✅ Conteúdo salvo! O site atualiza em segundos.");
    } catch(e){
      showToast("❌ Erro ao salvar. Tente novamente.", "err");
    }
    setSaving(false);
  };

  // ── HELPERS ─────────────────────────────────────────────────────────
  const setPagina  = (f,v) => setSite(p=>({...p, pagina:  {...p.pagina,  [f]:v}}));
  const setVisivel = (secao,v) => setSite(p=>({...p, visivel:{...p.visivel,[secao]:v}}));
  const setNav    = (f,v) => setSite(p=>({...p, nav:    {...p.nav,    [f]:v}}));
  const setHero   = (f,v) => setSite(p=>({...p, hero:   {...p.hero,   [f]:v}}));
  const setBolos  = (f,v) => setSite(p=>({...p, bolos:  {...p.bolos,  [f]:v}}));
  const setSteps  = (f,v) => setSite(p=>({...p, steps:  {...p.steps,  [f]:v}}));
  const setQuote  = (f,v) => setSite(p=>({...p, quote:  {...p.quote,  [f]:v}}));
  const setFooter = (f,v) => setSite(p=>({...p, footer: {...p.footer, [f]:v}}));

  const setPassoField = (i,f,v) => setSite(p=>({
    ...p, steps: { ...p.steps,
      passos: p.steps.passos.map((s,idx)=>idx===i?{...s,[f]:v}:s)
    }
  }));

  const setLinkPedir = (i,f,v) => setSite(p=>({
    ...p, footer: { ...p.footer,
      links_pedir: p.footer.links_pedir.map((l,idx)=>idx===i?{...l,[f]:v}:l)
    }
  }));
  const setLinkMarca = (i,f,v) => setSite(p=>({
    ...p, footer: { ...p.footer,
      links_marca: p.footer.links_marca.map((l,idx)=>idx===i?{...l,[f]:v}:l)
    }
  }));

  const addLinkPedir = () => setSite(p=>({...p, footer:{...p.footer,
    links_pedir:[...p.footer.links_pedir, {label:"novo link",href:"#",icone:"link"}]}}));
  const delLinkPedir = (i) => setSite(p=>({...p, footer:{...p.footer,
    links_pedir:p.footer.links_pedir.filter((_,idx)=>idx!==i)}}));

  const addLinkMarca = () => setSite(p=>({...p, footer:{...p.footer,
    links_marca:[...p.footer.links_marca, {label:"novo link",href:"#"}]}}));
  const delLinkMarca = (i) => setSite(p=>({...p, footer:{...p.footer,
    links_marca:p.footer.links_marca.filter((_,idx)=>idx!==i)}}));

  const addPasso = () => setSite(p=>({...p, steps:{...p.steps,
    passos:[...p.steps.passos, {n:`0${p.steps.passos.length+1}`,titulo:"novo passo",desc:"descrição do passo."}]}}));
  const delPasso = (i) => setSite(p=>({...p, steps:{...p.steps,
    passos:p.steps.passos.filter((_,idx)=>idx!==i)}}));

  if(loading) return (
    <div style={{textAlign:"center",padding:64,color:"#6b5f80"}}>
      <div style={{fontSize:32,marginBottom:8}}>🌐</div>
      <div>Carregando conteúdo do site...</div>
    </div>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>

      {/* Toast */}
      {toast && (
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",
          background:toast.tipo==="err"?"#7f1d1d":"#14532d",
          color:"#fff",padding:"11px 28px",borderRadius:10,fontSize:13,fontWeight:600,
          zIndex:9999,boxShadow:"0 4px 24px rgba(0,0,0,0.7)",maxWidth:"90vw",textAlign:"center"}}>
          {toast.msg}
        </div>
      )}

      {/* Header */}
      <div style={{background:"#13101e",border:"1.5px solid #2d2640",borderRadius:12,
        padding:"16px 20px",display:"flex",justifyContent:"space-between",
        alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontSize:16,fontWeight:800,color:"#c084fc",marginBottom:3}}>
            🌐 Conteúdo do Site
          </div>
          <div style={{fontSize:11,color:"#6b5f80"}}>
            Edite textos, links e seções · clique em uma seção para expandir · salve para publicar
          </div>
        </div>
        <button onClick={salvar} disabled={saving} style={{
          padding:"10px 28px",borderRadius:9,border:"none",cursor:"pointer",
          fontWeight:800,fontSize:13,minWidth:160,transition:"background 0.3s",
          background:saved?"linear-gradient(135deg,#22c55e,#16a34a)":"linear-gradient(135deg,#7c3aed,#6d28d9)",
          color:"#fff",opacity:saving?0.6:1}}>
          {saving?"Salvando...":saved?"✓ Publicado!":"🚀 Publicar no site"}
        </button>
      </div>

      {/* ── NAV ──────────────────────────────────────────────────── */}
      <SiteSection icon="🌐" title="Página — título e descrição" color="#c084fc" defaultOpen={true}>
        <div style={{paddingTop:14}}>
          <div style={{fontSize:11,color:"#6b5f80",marginBottom:12}}>
            Aparece na aba do navegador e no preview ao compartilhar o link.
          </div>
          <Field label="Título da aba do navegador"
            value={site.pagina?.titulo || "Dolce Luna · brownies artesanais"}
            onChange={v=>setPagina("titulo",v)}
            placeholder="Dolce Luna · brownies artesanais"/>
          <Field label="Descrição (preview ao compartilhar)"
            value={site.pagina?.descricao || "Brownies artesanais feitos com amor. Peça já!"}
            onChange={v=>setPagina("descricao",v)}
            multiline
            placeholder="Brownies artesanais feitos com amor..."/>
          <div style={{background:"#0d0b15",border:"1px solid #1e1a2e",borderRadius:8,
            padding:"10px 14px",marginTop:4}}>
            <div style={{fontSize:10,color:"#6b5f80",fontWeight:700,
              textTransform:"uppercase",marginBottom:6}}>Preview da aba</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:16,height:16,borderRadius:3,
                background:"linear-gradient(135deg,#7c3aed,#c084fc)",flexShrink:0}}/>

                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {site.pagina?.titulo || "Dolce Luna · brownies artesanais"}

            </div>
          </div>
        </div>
      </SiteSection>

      <SiteSection icon="🔗" title="Navegação" color="#818cf8" defaultOpen={true}>
        <div style={{paddingTop:14,display:"flex",flexDirection:"column",gap:14}}>

          {/* Links do menu */}
          <div>
            <div style={{fontSize:10,color:"#818cf8",fontWeight:800,
              textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>
              Links do menu
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {(site.nav.links_menu||[]).map((link,i)=>{
                const vis = link.visivel!==false;
                const setLink = (field,val) => {

                    background:"#0d0b15",

                    {/* Linha principal */}
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px"}}>
                      {/* Toggle visível */}

                      {/* Href */}

                        onChange={e=>setLink("href",e.target.value)}
                        placeholder="#ancora ou https://..."

                          border:"1px solid #2d2640",background:"#13101e",
                          color:"#6b5f80",fontSize:11,outline:"none"}}/>
                      {/* Mover */}
                      <div style={{display:"flex",flexDirection:"column",gap:1,flexShrink:0}}>

                            const arr=[...(site.nav.links_menu||[])];

                            background:"none",color:i===0?"#2d2640":"#818cf8",

                            const arr=[...(site.nav.links_menu||[])];
                            [arr[i+1],arr[i]]=[arr[i],arr[i+1]];
                            setNav("links_menu",arr);

                          style={{padding:"1px 5px",borderRadius:4,border:"1px solid #2d2640",
                            background:"none",
                            color:i===(site.nav.links_menu||[]).length-1?"#2d2640":"#818cf8",
                            fontSize:9,cursor:i===(site.nav.links_menu||[]).length-1?"default":"pointer",lineHeight:1.2}}>▼</button>
                      </div>
                      {/* Remover */}
                      <button onClick={()=>{
                          const arr=[...(site.nav.links_menu||[])].filter((_,idx)=>idx!==i);
                          setNav("links_menu",arr);
                        }}
                        style={{padding:"3px 6px",borderRadius:5,border:"1px solid #7f1d1d",
                          background:"none",color:"#f87171",fontSize:10,cursor:"pointer",flexShrink:0}}>
                        🗑
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={()=>{
                const arr=[...(site.nav.links_menu||[]),{label:"novo link",href:"#",visivel:true}];
                setNav("links_menu",arr);
              }}
              style={{marginTop:8,padding:"6px 14px",borderRadius:7,
                border:"1.5px dashed #3730a3",background:"#0d0a1a",
                color:"#818cf8",fontSize:11,fontWeight:700,cursor:"pointer"}}>
              + Adicionar link
            </button>
          </div>

          {/* Botão CTA */}
          <div>
            <div style={{fontSize:10,color:"#818cf8",fontWeight:800,

            <div style={{

              {site.nav.btn_visivel!==false&&(

                  <Field label="Texto" value={site.nav.btn_label}

                  <Field label="Link" value={site.nav.btn_link}

          </div>

        </div>
      </SiteSection>

      {/* ── HERO ─────────────────────────────────────────────────── */}
      <SiteSection icon="🌙" title="Hero — Banner principal" color="#c084fc" defaultOpen={true} secao="hero" visivel={site.visivel?.hero ?? true} onToggleVisivel={setVisivel}>
        <div style={{paddingTop:14}}>
          <Field label="Eyebrow (texto pequeno acima do título)"
            value={site.hero.eyebrow} onChange={v=>setHero("eyebrow",v)}
            placeholder="brownies artesanais · são paulo"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Field label="Título — linha 1"
              value={site.hero.titulo} onChange={v=>setHero("titulo",v)}
              placeholder="veja estrelas"/>
            <Field label="Título — linha 2 (script/cursiva)"
              value={site.hero.titulo_script} onChange={v=>setHero("titulo_script",v)}
              placeholder="a cada mordida."/>

          <Field label="Subtítulo / lead"
            value={site.hero.subtitulo} onChange={v=>setHero("subtitulo",v)}

                label:"Botão 1 — primário",

//  🛒  PRONTA ENTREGA TAB — gerencia produtos da seção de pronta entrega
// ═══════════════════════════════════════════════════════════════════════

const SB_URL_PE_TAB = "https://wmlecjrkqwoejuryeayz.supabase.co/rest/v1";
const SB_KEY_PE_TAB = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbGVjanJrcXdvZWp1cnllYXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgyMDYsImV4cCI6MjA5MTMyNDIwNn0.SAYFGBZFjvLn9jIEs8J5mR93ZY7HlYQbT43YTn8JKnI";
const SB_H_PE_TAB = { "Content-Type":"application/json","apikey":SB_KEY_PE_TAB,"Authorization":"Bearer "+SB_KEY_PE_TAB };

const CW_API_URL       = "https://integracao.cardapioweb.com/api/partner/v1/catalog";
const CW_TOKEN         = "72nYU8RrerRtZsJTqh87L9Jd5AUieTiwuHcaK7pANL8EcjNZ88FdfHNFZ3hu";
const VISIBILIDADE_KEY = "dl_pe_visibilidade";

function ProntaEntregaTab() {
  const [todosProdutos,  setTodosProdutos]  = useState([]);
  const [selecionados,   setSelecionados]   = useState(new Set()); // IDs de produtos visíveis
  const [catsVisiveis,   setCatsVisiveis]   = useState(new Set()); // nomes de categorias visíveis
  const [loadingApi,     setLoadingApi]     = useState(true);
  const [saving,         setSaving]         = useState(false);
  const [saved,          setSaved]          = useState(false);
  const [toast,          setToast]          = useState(null);
  const [catAtiva,       setCatAtiva]       = useState(null); // filtro do painel
  const [busca,          setBusca]          = useState("");
  const [linkCardapio,   setLinkCardapio]   = useState("https://app.cardapioweb.com/dolcelunabrownie");
  const [savingLink,     setSavingLink]     = useState(false);
  const [aba,            setAba]            = useState("produtos"); // "produtos" | "categorias"

  const showToast = (msg, tipo="ok") => {
    setToast({msg,tipo});
    setTimeout(()=>setToast(null), 3500);
  };

  // ── LOAD ────────────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      // 1. Carrega seleção salva
      try {
        const r = await fetch(
          SB_URL_PE_TAB+"/config?key=eq."+VISIBILIDADE_KEY+"&select=value",
          {headers:SB_H_PE_TAB}
        );
        if(r.ok){
          const d = await r.json();
          if(d.length>0&&d[0].value){
            const saved = JSON.parse(d[0].value);
            if(saved.ids)  setSelecionados(new Set(saved.ids));
            if(saved.cats) setCatsVisiveis(new Set(saved.cats));
          }
        }
        // Link do cardápio
        const rCfg = await fetch(
          SB_URL_PE_TAB+"/config?key=eq.dl_site_content&select=value",
          {headers:SB_H_PE_TAB}
        );
        if(rCfg.ok){
          const d = await rCfg.json();
          if(d.length>0&&d[0].value){
            const cfg = JSON.parse(d[0].value);
            if(cfg.pronta_entrega?.link_cardapio) setLinkCardapio(cfg.pronta_entrega.link_cardapio);
          }
        }
      } catch(e){}

      // 2. Carrega catálogo da API CW
      try {
        const r = await fetch(CW_API_URL, {
          headers:{
            "Accept":"application/json",
            "X-API-KEY":CW_TOKEN,
            "X-PARTNER-KEY":CW_TOKEN,
          }
        });
        if(r.ok){
          const data = await r.json();
          const lista = [];
          (data.categories||[]).forEach(cat=>{
            if(cat.status==="INACTIVE") return;
            (cat.items||[]).forEach(item=>{
              if(item.status==="INACTIVE") return;
              const preco = item.promotional_price_active && item.promotional_price
                ? item.promotional_price : item.price;
              lista.push({
                id:        item.id,
                nome:      item.name,
                categoria: cat.name,
                cat_id:    cat.id,
                descricao: item.description||"",
                preco,
                preco_orig: item.promotional_price_active ? item.price : null,
                imagem_url: item.image?.image_url||null,
                thumb_url:  item.image?.thumbnail_url||null,
                destaque:   item.highlighted||false,
                badge:      item.badge||null,
              });
            });
          });
          setTodosProdutos(lista);
          // Se ainda não tem categorias salvas, inicializa todas como visíveis
          setCatsVisiveis(prev=>{
            if(prev.size===0){
              const cats = [...new Set(lista.map(p=>p.categoria))];
              return new Set(cats);
            }
            return prev;
          });
        }
      } catch(e){
        showToast("⚠️ Não foi possível carregar da API CW.","warn");
      }
      setLoadingApi(false);
    })();
  },[]);

  // ── SALVAR ──────────────────────────────────────────────────────
  const salvar = async () => {
    setSaving(true);
    try {
      await fetch(SB_URL_PE_TAB+"/config",{
        method:"POST",
        headers:{...SB_H_PE_TAB,"Prefer":"resolution=merge-duplicates"},
        body:JSON.stringify({
          key:   VISIBILIDADE_KEY,
          value: JSON.stringify({
            ids:  [...selecionados],
            cats: [...catsVisiveis],
          })
        })
      });
      setSaved(true);
      setTimeout(()=>setSaved(false),2500);
      showToast("✅ Publicado! O site atualiza em segundos.");
    } catch(e){
      showToast("❌ Erro ao salvar.","err");
    }
    setSaving(false);
  };

  const salvarLink = async () => {
    setSavingLink(true);
    try {
      const rCfg = await fetch(SB_URL_PE_TAB+"/config?key=eq.dl_site_content&select=value",{headers:SB_H_PE_TAB});
      let current={};
      if(rCfg.ok){const d=await rCfg.json();if(d.length>0&&d[0].value) current=JSON.parse(d[0].value);}
      current.pronta_entrega={...(current.pronta_entrega||{}),link_cardapio:linkCardapio};
      await fetch(SB_URL_PE_TAB+"/config",{
        method:"POST",headers:{...SB_H_PE_TAB,"Prefer":"resolution=merge-duplicates"},
        body:JSON.stringify({key:"dl_site_content",value:JSON.stringify(current)})
      });
      showToast("✅ Link salvo!");
    } catch(e){ showToast("❌ Erro ao salvar link","err"); }
    setSavingLink(false);
  };

  // ── Helpers de seleção ───────────────────────────────────────────
  const toggleProduto = (id) => setSelecionados(prev=>{
    const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;
  });

  const toggleCategoria = (cat) => setCatsVisiveis(prev=>{
    const n=new Set(prev); n.has(cat)?n.delete(cat):n.add(cat); return n;
  });

  const selecionarCatProdutos = (cat, sel) => {
    const ids = todosProdutos.filter(p=>p.categoria===cat).map(p=>p.id);
    setSelecionados(prev=>{
      const n=new Set(prev);
      ids.forEach(id=>sel?n.add(id):n.delete(id));
      return n;
    });
  };

  const selecionarTodosProdutos = (sel) => {
    setSelecionados(sel ? new Set(todosProdutos.map(p=>p.id)) : new Set());
  };

  const todasCatsVisiveis = (sel) => {
    const cats = [...new Set(todosProdutos.map(p=>p.categoria))];
    setCatsVisiveis(sel ? new Set(cats) : new Set());
  };

  // ── Dados calculados ─────────────────────────────────────────────

<script type="text/babel" data-presets="react">

function RankingTop5() {
  const SB_R   = "https://wmlecjrkqwoejuryeayz.supabase.co/rest/v1";
  const SB_K_R = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbGVjanJrcXdvZWp1cnllYXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgyMDYsImV4cCI6MjA5MTMyNDIwNn0.SAYFGBZFjvLn9jIEs8J5mR93ZY7HlYQbT43YTn8JKnI";
  const HDR_R  = { apikey: SB_K_R, Authorization: "Bearer " + SB_K_R };

  const _hoje = new Date();
  const _mesAtual = new Date(_hoje.getFullYear(), _hoje.getMonth() - 1, 1).toISOString().slice(0, 7);
  const [rankData,    setRankData]    = useState({ top5: [], todos: [] });
  const [rankLoading, setRankLoading] = useState(true);
  const [rankMes,     setRankMes]     = useState(_mesAtual); // YYYY-MM
  const [showAll,     setShowAll]     = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setRankLoading(true);
      try {
        const meses = [rankMes];

        const [rVendas, rProd, rFichas, rInsumos, rRecs, rRecIngs] = await Promise.all([
          fetch(`${SB_R}/vendas_produtos?mes_referencia=eq.${rankMes}&select=produto_id,quantidade&limit=9999`, { headers: HDR_R }),
          fetch(`${SB_R}/catalogo_produtos?select=id,nome,categoria,subcategoria,preco_venda,porcoes,rendimento&limit=5000`, { headers: HDR_R }),
          fetch(`${SB_R}/ficha_tecnica?select=produto_id,insumo_cod,receita_id,quantidade&limit=9999`, { headers: HDR_R }),
          fetch(`${SB_R}/insumos?select=cod,preco&limit=5000`, { headers: HDR_R }),
          fetch(`${SB_R}/receitas_base?select=id,rendimento&limit=1000`, { headers: HDR_R }),
          fetch(`${SB_R}/receita_ingredientes?select=receita_id,insumo_cod,quantidade&limit=9999`, { headers: HDR_R }),
        ]);

        if (!rVendas.ok || !rProd.ok || cancelled) return;

        const vendas    = await rVendas.json();
        const prods     = await rProd.json();
        const fichasAll = rFichas.ok   ? await rFichas.json()   : [];
        const insumos   = rInsumos.ok  ? await rInsumos.json()  : [];
        const recs      = rRecs.ok     ? await rRecs.json()     : [];
        const recIngs   = rRecIngs.ok  ? await rRecIngs.json()  : [];

        if (cancelled) return;

        const precoIns = {};
        insumos.forEach(i => { precoIns[i.cod] = Number(i.preco) || 0; });

        const custoRec = {};
        recs.forEach(r => {
          const ings  = recIngs.filter(x => x.receita_id === r.id);
          const total = ings.reduce((s, x) => s + Number(x.quantidade) * (precoIns[x.insumo_cod] || 0), 0);
          custoRec[r.id] = Number(r.rendimento) > 0 ? total / Number(r.rendimento) : 0;
        });

        const custoProd = {};
        prods.forEach(p => {
          const fp    = fichasAll.filter(f => f.produto_id === p.id);
          const bruto = fp.reduce((s, f) => {
            if (f.insumo_cod) return s + Number(f.quantidade) * (precoIns[f.insumo_cod] || 0);
            if (f.receita_id) return s + Number(f.quantidade) * (custoRec[f.receita_id] || 0);
            return s;
          }, 0);
          const porcoes = Number(p.porcoes || 0);
          const rendNum = Number(String(p.rendimento || "").replace(/[^0-9.,]/g, "").replace(",", ".")) || 0;
          const divisor = porcoes > 1 ? porcoes : rendNum > 1 ? rendNum : 1;
          custoProd[p.id] = bruto / divisor;
        });

        const vendMap = {};
        vendas.forEach(v => { vendMap[v.produto_id] = (vendMap[v.produto_id] || 0) + Number(v.quantidade); });

        const prodMap = {};
        prods.forEach(p => { prodMap[p.id] = p; });

        const ranking = Object.entries(vendMap)
          .map(([pid, qtd]) => {
            const p = prodMap[pid];
            if (!p) return null;
            const pv   = Number(p.preco_venda) || 0;
            const cp   = custoProd[pid] || 0;
            const rec  = qtd * pv;
            const cust = qtd * cp;
            const marg  = rec > 0 ? ((rec - cust) / rec) * 100 : 0;
            const margR = rec - cust;
            return { pid: Number(pid), nome: p.nome, categoria: p.categoria,
                     subcategoria: p.subcategoria, qtd, pv, cp, rec, cust, marg, margR };
          })
          .filter(x => x && x.rec > 0);

        const maxQtd  = Math.max(...ranking.map(x => x.qtd),  1);
        const maxMarg = Math.max(...ranking.map(x => x.margR), 1);
        // Top 5: score combinado (volume + margem)
        const scored  = [...ranking]
          .map(x => ({ ...x, score: (x.qtd / maxQtd) * 0.5 + (x.margR / maxMarg) * 0.5 }))
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);
        // Modal: ordenado por quantidade vendida (mais vendidos primeiro)
        const porQtd  = [...ranking].sort((a, b) => b.qtd - a.qtd);

        setRankData({ top5: scored, todos: porQtd });
      } catch(e) { console.warn("Ranking:", e); }
      if (!cancelled) setRankLoading(false);
    })();
    return () => { cancelled = true; };
  }, [rankMes]);

  const fmt2    = v => "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
  const corMarg = m => m >= 40 ? "#4ade80" : m >= 20 ? "#f59e0b" : "#f87171";

  return (
    <div style={{ marginBottom:16, background:"#13101e", border:"1.5px solid #2d2640", borderRadius:14, overflow:"hidden" }}>
      {/* Header */}
      <div style={{ padding:"12px 16px", borderBottom:"1px solid #2d2640",
        display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
        <div>
          <div style={{ fontSize:13, fontWeight:800, color:"#f0e8ff" }}>
            🏆 Top 5 — Mais Vendidos & Mais Rentáveis
          </div>
          <div style={{ fontSize:10, color:"#6b5f80", marginTop:2 }}>
            {rankMes
              ? new Date(rankMes + "-15").toLocaleDateString("pt-BR", { month:"long", year:"numeric" })
              : "Selecione um mês"
            } · Score: volume + margem
          </div>
        </div>

function CurvaABC() {
  const SB_R   = "https://wmlecjrkqwoejuryeayz.supabase.co/rest/v1";
  const SB_K_R = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbGVjanJrcXdvZWp1cnllYXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgyMDYsImV4cCI6MjA5MTMyNDIwNn0.SAYFGBZFjvLn9jIEs8J5mR93ZY7HlYQbT43YTn8JKnI";
  const HDR_R  = { apikey: SB_K_R, Authorization: "Bearer " + SB_K_R };

  const _hoje     = new Date();
  const _mesAtual = new Date(_hoje.getFullYear(), _hoje.getMonth() - 1, 1).toISOString().slice(0, 7);

  const [dados,      setDados]      = useState({ A: [], B: [], C: [] });
  const [loading,    setLoading]    = useState(true);
  const [abcMes,     setAbcMes]     = useState(_mesAtual);
  const [classeAtiva,setClasseAtiva]= useState("A");
  const [showModal,  setShowModal]  = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const [rV, rP] = await Promise.all([
          fetch(`${SB_R}/vendas_produtos?mes_referencia=eq.${abcMes}&select=produto_id,quantidade&limit=9999`, { headers: HDR_R }),
          fetch(`${SB_R}/catalogo_produtos?select=id,nome,categoria,subcategoria,preco_venda&limit=5000`, { headers: HDR_R }),
        ]);
        if (!rV.ok || !rP.ok || cancelled) return;

        const vendas = await rV.json();
        const prods  = await rP.json();
        const prodMap = {};
        prods.forEach(p => { prodMap[p.id] = p; });

        // Calcula faturamento por produto
        const fatMap = {};
        vendas.forEach(v => {
          const p   = prodMap[v.produto_id];
          const pv  = Number(p?.preco_venda || 0);
          fatMap[v.produto_id] = (fatMap[v.produto_id] || { qtd: 0, fat: 0, prod: p });
          fatMap[v.produto_id].qtd += Number(v.quantidade);
          fatMap[v.produto_id].fat += Number(v.quantidade) * pv;
        });

        const lista = Object.values(fatMap)
          .filter(x => x.prod && x.fat > 0)
          .sort((a, b) => b.fat - a.fat);

        const totalFat = lista.reduce((s, x) => s + x.fat, 0);
        if (totalFat === 0 || cancelled) { setLoading(false); return; }

        // Classifica A/B/C por faturamento acumulado
        let acum = 0;
        const result = { A: [], B: [], C: [] };
        lista.forEach(item => {
          acum += item.fat;
          const pct = acum / totalFat;
          const classe = pct <= 0.80 ? "A" : pct <= 0.95 ? "B" : "C";
          result[classe].push({
            nome:         item.prod.nome,
            categoria:    item.prod.categoria,
            subcategoria: item.prod.subcategoria,
            qtd:          item.qtd,
            fat:          item.fat,
            fatPct:       item.fat / totalFat * 100,
            classe,
          });
        });

        if (!cancelled) setDados(result);
      } catch(e) { console.warn("CurvaABC:", e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [abcMes]);

  const fmt2   = v => "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
  const totalA = dados.A.reduce((s, x) => s + x.fat, 0);
  const totalB = dados.B.reduce((s, x) => s + x.fat, 0);
  const totalC = dados.C.reduce((s, x) => s + x.fat, 0);
  const total  = totalA + totalB + totalC;
  const nTotal = dados.A.length + dados.B.length + dados.C.length;

  const cfgClasse = {
    A: { cor: "#4ade80", bg: "#0a2e0a", border: "#166534", label: "Classe A", desc: "~80% do faturamento · Controle rigoroso" },
    B: { cor: "#f59e0b", bg: "#1a1400", border: "#92400e", label: "Classe B", desc: "~15% do faturamento · Monitoramento intermediário" },
    C: { cor: "#f87171", bg: "#1a0a0a", border: "#7f1d1d", label: "Classe C", desc: "~5% do faturamento · Controle simplificado" },
  };

  const RowItem = ({ item, i }) => {
    const cfg = cfgClasse[item.classe];
    return (
      <div style={{ display:"grid", gridTemplateColumns:"24px 1fr 60px 90px 60px",
        gap:8, padding:"8px 14px", alignItems:"center",
        background: i % 2 === 0 ? "#0d0b15" : "#100e1b",
        borderBottom:"1px solid #13101e" }}>
