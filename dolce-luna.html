            overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>

          </div>
          <div style={{ fontSize:9, color:"#6b5f80" }}>

        </div>
        <span style={{ fontSize:11, color:"#818cf8", textAlign:"right" }}>
          {item.qtd.toLocaleString("pt-BR")} un
        </span>
        <span style={{ fontSize:11, fontWeight:700, color:cfg.cor, textAlign:"right" }}>
          {fmt2(item.fat)}
        </span>
        <span style={{ fontSize:11, fontWeight:700, color:cfg.cor, textAlign:"right" }}>
          {item.fatPct.toFixed(1)}%
        </span>
      </div>
    );
  };

  return (
    <div style={{ marginBottom:16, background:"#13101e", border:"1.5px solid #2d2640",
      borderRadius:14, overflow:"hidden" }}>

            {abcMes
              ? new Date(abcMes + "-15").toLocaleDateString("pt-BR", { month:"long", year:"numeric" })
              : ""} · Classificação por faturamento acumulado
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <label style={{ fontSize:10, color:"#6b5f80" }}>Mês:</label>
          <select value={abcMes} onChange={e => setAbcMes(e.target.value)}
            style={{ padding:"4px 10px", borderRadius:8, border:"1px solid #3730a3",
              background:"#0d0b15", color:"#c084fc", fontSize:11, fontWeight:700, outline:"none", cursor:"pointer" }}>
            {Array.from({ length: 12 }, (_, i) => {
              const d = new Date();
              d.setDate(1);
              d.setMonth(d.getMonth() - i);
              const val   = d.toISOString().slice(0, 7);
              const label = d.toLocaleDateString("pt-BR", { month:"long", year:"numeric" });
              return <option key={val} value={val}>{label.charAt(0).toUpperCase() + label.slice(1)}</option>;
            })}

          <button onClick={() => setShowModal(true)}
            style={{ padding:"4px 10px", borderRadius:8, border:"1px solid #2d2640",

      {loading ? (

      ) : nTotal === 0 ? (

              {/* Filtro de classe no modal */}
              <div style={{ display:"flex", gap:4, alignItems:"center" }}>
                {["A","B","C","Todos"].map(cl => (
                  <button key={cl} onClick={e=>{e.stopPropagation();setClasseAtiva(cl==="Todos"?"A":cl);}}
                    style={{ padding:"4px 10px", borderRadius:20, fontSize:10, fontWeight:700, cursor:"pointer",
                      border:`1px solid ${cl==="Todos"?"#2d2640":(cfgClasse[cl]?.border||"#2d2640")}`,
                      background:"transparent",
                      color: cl==="Todos" ? "#6b5f80" : (cfgClasse[cl]?.cor||"#6b5f80") }}>
                    {cl}
                  </button>
                ))}
                <button onClick={() => setShowModal(false)}
                  style={{ background:"none", border:"none", color:"#6b5f80", fontSize:22, cursor:"pointer", marginLeft:8 }}>✕</button>
              </div>
            </div>

            {/* Todas as classes no modal */}
            <div style={{ overflowY:"auto", flex:1 }}>
              {["A","B","C"].map(cl => {
                const cfg = cfgClasse[cl];
                const items = dados[cl];
                if (!items.length) return null;
                return (
                  <div key={cl}>
                    <div style={{ padding:"8px 18px", background:cfg.bg, borderBottom:`1px solid ${cfg.border}`,
                      display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <span style={{ fontSize:11, fontWeight:800, color:cfg.cor }}>
                        Classe {cl} — {items.length} produto{items.length!==1?"s":""}
                      </span>
                      <span style={{ fontSize:10, color:cfg.cor }}>
                        {fmt2(cl==="A"?totalA:cl==="B"?totalB:totalC)} · {((cl==="A"?totalA:cl==="B"?totalB:totalC)/total*100).toFixed(1)}% do fat.
                      </span>
                    </div>
                    <div style={{ display:"grid", gridTemplateColumns:"24px 1fr 60px 90px 60px",
                      gap:8, padding:"5px 18px", borderBottom:"1px solid #1e1a2e",
                      fontSize:9, color:"#4a3f60", textTransform:"uppercase" }}>
                      <span>#</span><span>Produto</span>
                      <span style={{textAlign:"right"}}>Qtd</span>
                      <span style={{textAlign:"right"}}>Fat.</span>
                      <span style={{textAlign:"right"}}>% Fat.</span>
                    </div>
                    {items.map((item, i) => <RowItem key={i} item={item} i={i} />)}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}



function MatrizProdutosMeses() {
  const SB_R   = "https://wmlecjrkqwoejuryeayz.supabase.co/rest/v1";
  const SB_K_R = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbGVjanJrcXdvZWp1cnllYXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgyMDYsImV4cCI6MjA5MTMyNDIwNn0.SAYFGBZFjvLn9jIEs8J5mR93ZY7HlYQbT43YTn8JKnI";
  const HDR_R  = { apikey: SB_K_R, Authorization: "Bearer " + SB_K_R };

  // Gera últimos 12 meses disponíveis
  const todosMeses = Array.from({ length: 12 }, (_, i) => {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() - i);
    return d.toISOString().slice(0, 7);
  }).reverse();

  // Inicia com últimos 3 meses selecionados
  const [mesesSel,    setMesesSel]    = useState(todosMeses.slice(-3));
  const [loading,     setLoading]     = useState(true);
  const [produtos,    setProdutos]    = useState([]);
  const [vendas,      setVendas]      = useState([]);
  const [selProdutos, setSelProdutos] = useState([]);
  const [metrica,     setMetrica]     = useState("qtd");
  const [busca,       setBusca]       = useState("");
  const [catFiltro,   setCatFiltro]   = useState(""); // filtro de categoria no dropdown
  const [dropOpen,    setDropOpen]    = useState(false);
  const [mesesOpen,   setMesesOpen]   = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const [rP, rV] = await Promise.all([
          fetch(`${SB_R}/catalogo_produtos?select=id,nome,categoria,subcategoria,preco_venda&order=categoria,nome&limit=5000`, { headers: HDR_R }),
          fetch(`${SB_R}/vendas_produtos?mes_referencia=in.(${todosMeses.map(m=>`"${m}"`).join(",")})&select=produto_id,quantidade,mes_referencia&limit=99999`, { headers: HDR_R }),
        ]);
        if (cancelled) return;
        const p = rP.ok ? await rP.json() : [];
        const v = rV.ok ? await rV.json() : [];
        setProdutos(Array.isArray(p) ? p : []);
        setVendas(Array.isArray(v) ? v : []);
        // Pré-seleciona os 5 mais vendidos
        if (v.length > 0) {
          const qtdMap = {};
          v.forEach(x => { qtdMap[x.produto_id] = (qtdMap[x.produto_id]||0) + Number(x.quantidade); });
          const top5 = Object.entries(qtdMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id])=>Number(id));
          if (!cancelled) setSelProdutos(top5);
        }
      } catch(e) { console.warn("Matriz:", e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, []);

  // Meses selecionados em ordem cronológica
  const meses = [...mesesSel].sort();

  const prodMap = {};
  produtos.forEach(p => { prodMap[p.id] = p; });

  const vendaMap = {};
  vendas.forEach(v => {
    const pv = Number(prodMap[v.produto_id]?.preco_venda || 0);
    if (!vendaMap[v.produto_id]) vendaMap[v.produto_id] = {};
    if (!vendaMap[v.produto_id][v.mes_referencia]) vendaMap[v.produto_id][v.mes_referencia] = { qtd: 0, fat: 0 };
    vendaMap[v.produto_id][v.mes_referencia].qtd += Number(v.quantidade);
    vendaMap[v.produto_id][v.mes_referencia].fat += Number(v.quantidade) * pv;
  });

  const prodsSel = selProdutos.map(id => prodMap[id]).filter(Boolean);

  const todosValores = prodsSel.flatMap(p => meses.map(m => (vendaMap[p.id]?.[m]?.[metrica] || 0)));
  const maxVal = Math.max(...todosValores, 1);

  const fmt2    = v => "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
  const fmtMes  = m => { const d = new Date(m+"-15"); return d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(".",""); };
  const fmtMesLong = m => { const d = new Date(m+"-15"); const l = d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); return l.charAt(0).toUpperCase()+l.slice(1); };
  const heatColor = (val, max) => {
    if (val === 0) return { bg:"#0d0b15", cor:"#2d2640" };
    const r = val / max;
    if (r > 0.75) return { bg:"#052e16", cor:"#4ade80" };
    if (r > 0.45) return { bg:"#0a2e0a", cor:"#86efac" };
    if (r > 0.20) return { bg:"#1a2e00", cor:"#bef264" };
    return { bg:"#1a2e1a", cor:"#6b7280" };
  };

  const categorias = [...new Set(produtos.map(p => p.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const prodsFiltrados = produtos.filter(p => {
    if (catFiltro && p.categoria !== catFiltro) return false;

    return true;

  const toggleProd = id => setSelProdutos(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  return (
    <div style={{ marginBottom:16, background:"#13101e", border:"1.5px solid #2d2640", borderRadius:14, overflow:"hidden" }}>

        display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>

          <div style={{ fontSize:13, fontWeight:800, color:"#f0e8ff" }}>🗂 Produtos × Meses</div>

            Selecione produtos e meses para comparar a evolução
          </div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
          {/* Métrica */}
          <div style={{ display:"flex", borderRadius:8, overflow:"hidden", border:"1px solid #2d2640" }}>
            {[["qtd","Quantidade"],["fat","Faturamento"]].map(([v,l])=>(
              <button key={v} onClick={()=>setMetrica(v)}
                style={{ padding:"4px 10px", fontSize:10, fontWeight:700, border:"none", cursor:"pointer",
                  background:metrica===v?"#2d1254":"transparent", color:metrica===v?"#c084fc":"#6b5f80" }}>
                {l}
              </button>
            ))}
          </div>
          {/* Seletor de meses */}
          <div style={{ position:"relative" }}>
            <button onClick={()=>setMesesOpen(o=>!o)}
              style={{ padding:"4px 12px", borderRadius:8, border:"1px solid #1e3a5f",
                background:"#0a1628", color:"#60a5fa", fontSize:10, fontWeight:700, cursor:"pointer" }}>
              📅 {mesesSel.length} {mesesSel.length===1?"mês":"meses"} ▼
            </button>
            {mesesOpen && (
              <div style={{ position:"absolute", right:0, top:"calc(100% + 4px)", zIndex:300,
                background:"#13101e", border:"1.5px solid #1e3a5f", borderRadius:10,
                width:220, boxShadow:"0 8px 32px rgba(0,0,0,0.6)", overflow:"hidden" }}>
                <div style={{ padding:"8px 12px", borderBottom:"1px solid #1e1a2e",
                  fontSize:10, color:"#4a3f60", display:"flex", justifyContent:"space-between", flexShrink:0 }}>
                  <span>Selecione os meses</span>
                  <button onClick={()=>setMesesOpen(false)}
                    style={{ background:"none", border:"none", color:"#6b5f80", cursor:"pointer", fontSize:13 }}>✕</button>
                </div>
                <div style={{ maxHeight:280, overflowY:"auto" }}>
                {todosMeses.map(m => (
                  <div key={m} onClick={()=>toggleMes(m)}
                    style={{ padding:"8px 14px", fontSize:11, cursor:"pointer",
                      background: mesesSel.includes(m)?"#0a1628":"transparent",
                      color: mesesSel.includes(m)?"#60a5fa":"#c8b8e8",
                      borderBottom:"1px solid #1e1a2e",
                      display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:12 }}>{mesesSel.includes(m)?"✅":"⬜"}</span>
                    {fmtMesLong(m)}
                  </div>
                ))}
                </div>
                <div style={{ padding:"8px 12px", borderTop:"1px solid #1e1a2e",
                  fontSize:10, color:"#4a3f60", textAlign:"center" }}>
                  Mín. 1 mês · máx. 12 meses
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Seletor de produtos */}
      <div style={{ padding:"10px 16px", borderBottom:"1px solid #1e1a2e",
        display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", flex:1 }}>
          {prodsSel.length === 0
            ? <span style={{ fontSize:11, color:"#4a3f60" }}>Nenhum produto selecionado</span>
            : prodsSel.map(p => (
              <div key={p.id} style={{ display:"flex", alignItems:"center", gap:4,
                background:"#1a1030", border:"1px solid #3730a3", borderRadius:99,
                padding:"3px 10px", fontSize:11, color:"#c084fc" }}>
                {p.nome}
                <span onClick={()=>toggleProd(p.id)}
                  style={{ cursor:"pointer", color:"#6b5f80", fontSize:12, marginLeft:2, lineHeight:1 }}>✕</span>
              </div>
            ))
          }
        </div>
        {/* Dropdown produtos */}
        <div style={{ position:"relative" }}>
          <button onClick={()=>{ setDropOpen(o=>!o); setBusca(""); setCatFiltro(""); }}

              background:"#0d0b15", color:"#818cf8", fontSize:11, fontWeight:700, cursor:"pointer" }}>

          {dropOpen && (
            <div style={{ position:"absolute", right:0, top:"calc(100% + 4px)", zIndex:300,

              <div style={{ padding:"8px 10px", borderBottom:"1px solid #2d2640",
                display:"flex", gap:6, alignItems:"center" }}>
                <input autoFocus value={busca} onChange={e=>setBusca(e.target.value)}

                  style={{ flex:1, background:"#0d0b15", border:"1px solid #2d2640",
                    borderRadius:6, padding:"5px 10px", color:"#f0e8ff", fontSize:11,

                fontSize:10, color:"#4a3f60", textAlign:"center" }}>

                  borderBottom:"1px solid #1e1a2e", borderLeft:"1px solid #1e1a2e" }}>
                  TOTAL
                </th>
              </tr>
            </thead>
            <tbody>
              {prodsSel.map((prod, pi) => {
                const totalProd = meses.reduce((s, m) => s + (vendaMap[prod.id]?.[m]?.[metrica] || 0), 0);
                return (
                  <tr key={prod.id} style={{ background: pi%2===0?"#0d0b15":"#100e1b" }}>
                    <td style={{ padding:"8px 14px", position:"sticky", left:0,
                      background: pi%2===0?"#0d0b15":"#100e1b",
                      borderBottom:"1px solid #1e1a2e", borderRight:"1px solid #1e1a2e" }}>
                      <div style={{ fontSize:11, fontWeight:600, color:"#e9d5ff",
                        overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:180 }}>
                        {prod.nome}
                      </div>
                      <div style={{ fontSize:9, color:"#4a3f60" }}>{prod.categoria}</div>
                    </td>
                    {meses.map(m => {
                      const val = vendaMap[prod.id]?.[m]?.[metrica] || 0;
                      const { bg, cor } = heatColor(val, maxVal);
                      return (
                        <td key={m} style={{ padding:4, textAlign:"center",
                          borderBottom:"1px solid #1e1a2e", borderLeft:"1px solid #1e1a2e" }}>
                          <div style={{ background:bg, borderRadius:6, padding:"6px 4px", margin:"0 2px" }}>
                            <div style={{ fontSize:12, fontWeight:800, color:cor }}>
                              {val > 0
                                ? metrica==="qtd"
                                  ? val.toLocaleString("pt-BR")
                                  : `R$ ${val.toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0})}`
                                : <span style={{ color:"#2d2640", fontSize:10 }}>—</span>
                              }
                            </div>
                          </div>
                        </td>
                      );
                    })}
                    <td style={{ padding:"8px 10px", textAlign:"right",
                      borderBottom:"1px solid #1e1a2e", borderLeft:"1px solid #1e1a2e" }}>
                      <span style={{ fontSize:11, fontWeight:800, color: totalProd>0?"#c084fc":"#2d2640" }}>
                        {totalProd > 0
                          ? metrica==="qtd" ? totalProd.toLocaleString("pt-BR")+" un" : fmt2(totalProd)
                          : "—"}
                      </span>
                    </td>
                  </tr>
                );
              })}
              {/* Linha totais por mês */}
              <tr style={{ background:"#13101e", borderTop:"2px solid #2d2640" }}>
                <td style={{ padding:"8px 14px", fontSize:10, color:"#6b5f80", fontWeight:700,
                  position:"sticky", left:0, background:"#13101e", borderRight:"1px solid #1e1a2e" }}>
                  TOTAL / MÊS
                </td>
                {meses.map(m => {
                  const tot = prodsSel.reduce((s,p)=>s+(vendaMap[p.id]?.[m]?.[metrica]||0),0);
                  return (
                    <td key={m} style={{ padding:"8px 6px", textAlign:"center", borderLeft:"1px solid #1e1a2e" }}>
                      <span style={{ fontSize:10, fontWeight:700, color:tot>0?"#818cf8":"#2d2640" }}>
                        {tot>0 ? (metrica==="qtd" ? tot.toLocaleString("pt-BR") : `R$ ${tot.toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0})}`) : "—"}
                      </span>
                    </td>
                  );
                })}
                <td style={{ padding:"8px 10px", textAlign:"right", borderLeft:"1px solid #1e1a2e" }}>
                  <span style={{ fontSize:11, fontWeight:900, color:"#c084fc" }}>
                    {(()=>{
                      const tot = prodsSel.reduce((s,p)=>s+meses.reduce((ss,m)=>ss+(vendaMap[p.id]?.[m]?.[metrica]||0),0),0);
                      return metrica==="qtd" ? tot.toLocaleString("pt-BR")+" un" : fmt2(tot);
                    })()}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
          {/* Legenda */}
          <div style={{ padding:"8px 16px", borderTop:"1px solid #1e1a2e",
            display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
            <span style={{ fontSize:9, color:"#4a3f60" }}>Intensidade:</span>
            {[["#2d2640","#0d0b15","Nenhum"],["#6b7280","#1a2e1a","Baixo"],
              ["#bef264","#1a2e00","Médio"],["#86efac","#0a2e0a","Alto"],["#4ade80","#052e16","Máximo"]
            ].map(([cor,bg,l])=>(
              <div key={l} style={{ display:"flex", alignItems:"center", gap:4 }}>
                <div style={{ width:14, height:14, borderRadius:4, background:bg, border:`1px solid ${cor}` }}/>
                <span style={{ fontSize:9, color:"#6b5f80" }}>{l}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

          const d = await r.json();
          setCompras(Array.isArray(d) ? d : comprasProp);
        }
      } catch(e) { console.warn("RelatorioCompras:", e); }
      setLoading(false);
    })();
  }, []);

  const fmt2   = v => "R$ " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtMes = m => { const d=new Date(m+"-15"); const l=d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); return l.charAt(0).toUpperCase()+l.slice(1); };
  const corBar = (v,max) => v/max>0.7?"#f87171":v/max>0.4?"#f59e0b":"#4ade80";

  const mesesDisp   = [...new Set(compras.map(c=>c.data?.slice(0,7)).filter(Boolean))].sort().reverse();
  const comprasFilt = mesSel==="todos" ? compras : compras.filter(c=>c.data?.slice(0,7)===mesSel);

  const porInsumo = {};
  comprasFilt.forEach(c => {
    const k = String(c.insumo_cod||c.insumo_nome||"?");
    if (!porInsumo[k]) porInsumo[k] = { cod:c.insumo_cod, nome:c.insumo_nome||"?", unid:c.unid||"", qtd:0, total:0, nCompras:0, fornecedores:new Set() };
    porInsumo[k].qtd      += Number(c.quantidade)||0;
    porInsumo[k].total    += (Number(c.quantidade)||0)*(Number(c.preco_unitario)||0);
    porInsumo[k].nCompras += 1;
    if (c.fornecedor) porInsumo[k].fornecedores.add(c.fornecedor);
    if (!porInsumo[k].comprasList) porInsumo[k].comprasList = [];
    porInsumo[k].comprasList.push(c);
  });

  let lista = Object.values(porInsumo).filter(x => !busca || x.nome.toLowerCase().includes(busca.toLowerCase()));
  if (ordenar==="total_desc") lista.sort((a,b)=>b.total-a.total);
  else if (ordenar==="qtd_desc") lista.sort((a,b)=>b.qtd-a.qtd);
  else lista.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));

  const totalGeral = lista.reduce((s,x)=>s+x.total,0);
  const maxTotal   = Math.max(...lista.map(x=>x.total),1);

  const porMes = {};
  compras.forEach(c => {
    const m = c.data?.slice(0,7); if (!m) return;
    if (!porMes[m]) porMes[m] = { total:0, n:0, ins:new Set() };
    porMes[m].total += (Number(c.quantidade)||0)*(Number(c.preco_unitario)||0);
    porMes[m].n     += 1;
    porMes[m].ins.add(c.insumo_nome);
  });
  const mesesOrdenados = Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0]));
  const maxMes = Math.max(...mesesOrdenados.map(([,d])=>d.total),1);

          {mesesDisp.map(m=><option key={m} value={m}>{fmtMes(m)}</option>)}

              {l}
            </button>

        </div>
        {mesSel!=="todos" && (

      <div style={{ marginBottom:12, padding:"10px 16px", background:"#13101e", borderRadius:10, border:"1px solid #2d2640",
        display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <span style={{ fontSize:11, color:"#6b5f80" }}>
          {mesSel==="todos" ? "Total geral" : fmtMes(mesSel)} · {lista.length} insumo{lista.length!==1?"s":""}
        </span>
        <span style={{ fontSize:16, fontWeight:900, color:"#f59e0b" }}>{fmt2(totalGeral)}</span>
      </div>

      {lista.length===0 ? (

          {compras.length===0 ? "Nenhuma compra registrada ainda." : "Nenhum insumo encontrado."}

        <div style={{ background:"#13101e", borderRadius:12, border:"1.5px solid #2d2640", overflow:"hidden" }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 90px 110px 120px 80px",
            gap:8, padding:"8px 16px", borderBottom:"1px solid #1e1a2e",
            fontSize:9, color:"#4a3f60", textTransform:"uppercase", letterSpacing:"0.06em" }}>
            <span>Insumo</span>
            <span style={{textAlign:"right"}}>Qtd.</span>
            <span style={{textAlign:"right"}}>Preço médio</span>
            <span style={{textAlign:"right"}}>Total gasto</span>
            <span style={{textAlign:"right"}}>%</span>
          </div>
          {lista.map((item,i) => {
            const pct    = totalGeral>0 ? item.total/totalGeral*100 : 0;
            const precoM = item.qtd>0 ? item.total/item.qtd : 0;
            const key    = item.cod||item.nome;
            const isExp  = expandido === key;
            // Compras individuais ordenadas por data desc
            const comprasItem = (item.comprasList||[]).slice().sort((a,b)=>
              (b.data||"").localeCompare(a.data||""));
            return (
              <div key={key}>
                {/* Linha principal */}
                <div onClick={()=>setExpandido(isExp?null:key)}
                  style={{ display:"grid", gridTemplateColumns:"1fr 90px 110px 120px 80px",
                    gap:8, padding:"10px 16px", alignItems:"center", cursor:"pointer",
                    background:i%2===0?"#0d0b15":"#100e1b", borderBottom: isExp?"none":"1px solid #13101e" }}>
                  <div>
                    <div style={{ fontSize:12, fontWeight:600, color:"#e9d5ff", display:"flex", alignItems:"center", gap:6 }}>
                      {item.nome}
                      <span style={{ fontSize:9, color:"#4a3f60" }}>{isExp?"▲":"▼"}</span>
                    </div>
                    <div style={{ display:"flex", gap:5, marginTop:3, flexWrap:"wrap", alignItems:"center" }}>
                      {[...item.fornecedores].slice(0,2).map(f=>(

                    </div>
                    <div style={{ marginTop:5, height:2, borderRadius:99, background:"#1e1a2e" }}>
                      <div style={{ height:"100%", borderRadius:99, background:corBar(item.total,maxTotal), width:(item.total/maxTotal*100)+"%" }} />
                    </div>
                  </div>
                  <div style={{ fontSize:11, fontWeight:600, color:"#818cf8", textAlign:"right" }}>
                    {item.qtd.toLocaleString("pt-BR",{maximumFractionDigits:3})} {item.unid}
                  </div>
                  <div style={{ fontSize:11, color:"#6b5f80", textAlign:"right" }}>
                    {fmt2(precoM)}/{item.unid}
                  </div>
                  <div style={{ fontSize:13, fontWeight:800, color:"#f59e0b", textAlign:"right" }}>
                    {fmt2(item.total)}
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <span style={{ fontSize:12, fontWeight:700, color:pct>20?"#f87171":pct>10?"#f59e0b":"#4ade80" }}>
                      {pct.toFixed(1)}%
                    </span>
                  </div>
                </div>
                {/* Detalhe das compras individuais */}
                {isExp && (
                  <div style={{ background:"#0a0914", borderBottom:"1px solid #13101e",
                    padding:"8px 16px 12px 32px" }}>
                    <div style={{ fontSize:9, color:"#4a3f60", textTransform:"uppercase",
                      letterSpacing:"0.06em", marginBottom:6 }}>
                      Compras individuais
                    </div>
                    {comprasItem.map((c,ci) => {
                      const puNum = Number(c.preco_unitario)||0;
                      const qtdNum = Number(c.quantidade)||0;
                      const totalC = puNum * qtdNum;
                      // Flag se preço unitário parece ser o total (muito alto vs qtd)
                      const suspeito = qtdNum > 1 && puNum > 10 && puNum === totalC;
                      return (
                        <div key={c.id||ci} style={{ display:"flex", gap:12, padding:"5px 0",
                          borderBottom:"1px solid #1e1a2e", alignItems:"center", flexWrap:"wrap" }}>
                          <span style={{ fontSize:10, color:"#6b5f80", minWidth:80 }}>
                            {c.data||"—"}
                          </span>
                          <span style={{ fontSize:10, color:"#c8b8e8", flex:1 }}>
                            {qtdNum.toLocaleString("pt-BR",{maximumFractionDigits:3})} {c.unid}
                          </span>
                          <span style={{ fontSize:10, fontWeight:700, color: suspeito?"#f87171":"#818cf8" }}>
                            {fmt2(puNum)}/{c.unid}
                            {suspeito && <span title="Valor suspeito — pode ser o total pago em vez do unitário"> ⚠️</span>}
                          </span>
                          <span style={{ fontSize:10, color:"#f59e0b" }}>
                            = {fmt2(totalC)}
                          </span>
                          {c.fornecedor && (
                            <span style={{ fontSize:9, color:"#4a3f60", background:"#1e1a2e",
                              padding:"1px 6px", borderRadius:99 }}>{c.fornecedor}</span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 90px 110px 120px 80px",
            gap:8, padding:"10px 16px", borderTop:"2px solid #2d2640", background:"#13101e", alignItems:"center" }}>
            <span style={{ fontSize:11, fontWeight:700, color:"#6b5f80" }}>Total ({lista.length} insumos)</span>
            <span /><span />
            <span style={{ fontSize:14, fontWeight:900, color:"#f59e0b", textAlign:"right" }}>{fmt2(totalGeral)}</span>
            <span style={{ fontSize:11, fontWeight:700, color:"#c084fc", textAlign:"right" }}>100%</span>
          </div>
        </div>
      )}
    </div>
  );
}

  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbGVjanJrcXdvZWp1cnllYXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgyMDYsImV4cCI6MjA5MTMyNDIwNn0.SAYFGBZFjvLn9jIEs8J5mR93ZY7HlYQbT43YTn8JKnI";
  const H = { "Content-Type": "application/json", "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };

  // window.storage como fallback local
  const wSet = async (key, value) => { try { await window.storage.set(key, JSON.stringify(value)); } catch {} };
  const wGet = async (key) => { try { const r = await window.storage.get(key); return r?.value ? JSON.parse(r.value) : null; } catch { return null; } };

  // Supabase: busca tabela inteira
  const sbList = async (table) => {
    try {
      const r = await fetch(SB + "/" + table + "?select=*&order=id.asc&limit=10000", { headers: H });
      if (!r.ok) return null;
      const d = await r.json();
      return Array.isArray(d) && d.length > 0 ? d : null;
    } catch { return null; }
  };

  // Supabase: busca config
  const sbGetCfg = async (key) => {
    try {
      const r = await fetch(SB + "/config?key=eq." + encodeURIComponent(key) + "&select=value", { headers: H });
      if (!r.ok) return null;
      const d = await r.json();
      return d.length ? JSON.parse(d[0].value) : null;
    } catch { return null; }
  };

  // Supabase: salva config (upsert)
  const sbSetCfg = async (key, value) => {
    try {
      await fetch(SB + "/config", {
        method: "POST",
        headers: { ...H, "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify({ key, value: JSON.stringify(value) })
      });
    } catch {}
    await wSet("dl_" + key.replace("dl_",""), value); // fallback local
  };

  // Supabase: sincroniza tabela via UPSERT (nunca deleta tudo — evita perda de dados)
  const sbSync = async (table, rows) => {
    try {
      if (rows.length > 0) {
        const normalized = rows.map(r => {
          const row = { ...r, valor: Number(r.valor || 0) };
          if (table === "transferencias") {
            if (row.saidoBanco !== undefined) { row.saidobanco = row.saidoBanco; delete row.saidoBanco; }
            if (row.entrouBanco !== undefined) { row.entroubanco = row.entrouBanco; delete row.entrouBanco; }
          }
          return row;
        });
        // Chunks de 500 para não exceder limite da API
        for (let i = 0; i < normalized.length; i += 500) {
          const res = await fetch(SB + "/" + table, {
            method: "POST",
            headers: { ...H, "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(normalized.slice(i, i + 500))
          });
          if (!res.ok) {
            const txt = await res.text().catch(() => "");
            console.error(`[sbSync] ${table} chunk ${i} → HTTP ${res.status}:`, txt);
          }
        }
      }
    } catch(e) { console.error("[sbSync] network error:", table, e); }
    await wSet("dl_" + table, rows); // fallback local
  };

  // Deleta um registro específico pelo ID (para remoções unitárias)
  const sbDelete = async (table, id) => {
    try {
      const res = await fetch(`${SB}/${table}?id=eq.${id}`, { method: "DELETE", headers: H });
      if (!res.ok) console.error(`[sbDelete] ${table}/${id} → HTTP ${res.status}`);
    } catch(e) { console.error("[sbDelete] network error:", table, id, e); }
  };

  // Atualiza UM registro pelo ID via PATCH (para edições unitárias)
  const sbPatch = async (table, id, fields) => {
    try {
      // Colunas válidas por tabela — evita rejeição por campos extras do formulário
      const COLS = {
        receitas:  ["data","documento","plano","conta","tipo","descricao","banco","valor","vencimento","recebimento"],
        despesas:  ["data","documento","plano","conta","tipo","descricao","banco","valor","vencimento","pagamento","receita_id"],
      };
      const allowed = COLS[table] || Object.keys(fields).filter(k => k !== "id");
      const body = {};
      allowed.forEach(k => { if (fields[k] !== undefined) body[k] = fields[k]; });
      if (body.valor !== undefined) body.valor = Number(body.valor);

      const res = await fetch(`${SB}/${table}?id=eq.${id}`, {
        method: "PATCH",
        headers: { ...H, "Prefer": "return=minimal" },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        console.error(`[sbPatch] ${table}/${id} → HTTP ${res.status}:`, txt);
      } else {
        console.log(`[sbPatch] ${table}/${id} OK — plano="${body.plano}" conta="${body.conta}"`);
      }
    } catch(e) { console.error("[sbPatch] network error:", table, id, e); }
  };

  // ── Load: tenta Supabase, cai no window.storage, cai nos defaults ──────────
  useEffect(() => {
    (async () => {
      const [recSB, despSB, hisSB, tvSB, crSB, cdSB, bSB, bcSB, sSB, fSB, mSB, tdSB, phSB, insSB, compSB, recBasesSB, recIngsSB, pcSB] = await Promise.all([
        sbList("receitas"), sbList("despesas"), sbList("historico_importacoes"),
        sbGetCfg("dl_transferencias"), sbGetCfg("dl_catReceita"), sbGetCfg("dl_catDespesa"),
        sbGetCfg("dl_bancos"), sbGetCfg("dl_bancoCnpj"), sbGetCfg("dl_saldos"), sbGetCfg("dl_fornecedores"),
        sbGetCfg("dl_metas"), sbGetCfg("dl_tiposDocto"), sbGetCfg("dl_senha_hash"),
        sbList("insumos"), sbList("compras"), sbList("receitas_base"), sbList("receita_ingredientes"),
        sbGetCfg("dl_precifConfig"),
      ]);

      // Fallback local para configs não encontradas no Supabase
      const tv  = tvSB  ?? await wGet("dl_transferencias") ?? TRANSFERENCIAS_INICIAIS;
      const crv = crSB  ?? await wGet("dl_catReceita")     ?? CAT_RECEITA_INICIAL;
      const cdv = cdSB  ?? await wGet("dl_catDespesa")     ?? CAT_DESPESA_INICIAL;
      const bv  = bSB   ?? await wGet("dl_bancos")         ?? BANCOS_INICIAL;
      const bcv = bcSB  ?? await wGet("dl_bancoCnpj")     ?? {};

              insumos={insumos}
              compras={compras}
              onSaveCompra={c => setCompras(prev => prev.some(x=>x.id===c.id) ? prev : [...prev, c])}
              onDeleteCompra={id => setCompras(prev => prev.filter(c => c.id !== id))}
              onUpdateInsumo={(cod, preco) => setInsumos(prev => prev.map(i => i.cod === cod ? { ...i, preco } : i))}
              onAddInsumo={ins => setInsumos(prev => [...prev, ins])}
            />
          )}
          {tab === "fichas-tecnicas" && <FichasTecnicasTab insumos={insumos} receitas={receitasProd} />}
          {tab === "receitas-prod" && <ReceitasProducaoTab insumos={insumos} receitas={receitasProd} setReceitas={setReceitasProd} setRecIngredientes={setRecIngredientes} />}
          {tab === "precificacao" && <PrecificacaoTab insumos={insumos} compras={compras} receitasProd={receitasProd} precifConfig={precifConfig} onUpdatePrecifConfig={setPrecifConfig} rateioDesp={rateioDesp} onUpdateInsumo={(cod, preco) => setInsumos(prev => prev.map(i => i.cod === cod ? { ...i, preco } : i))} />}
          {tab === "insumos" && <InsumosPrecosTab insumos={insumos} compras={compras}
          onUpdateInsumo={(cod, preco, extra) => setInsumos(prev => prev.map(i => i.cod === cod ? { ...i, preco, ...(extra||{}) } : i))}
          onDeleteInsumo={(cod) => setInsumos(prev => prev.filter(i => i.cod !== cod))}
          />}

          {/* ── DESPESAS FIXAS ── */}
          {tab === "despesas-fixas" && <DespesasFixasTab onRateioCalculado={setRateioDesp} />}

          {/* ── CARDÁPIO DE BOLOS ── */}
          {tab === "cardapio-bolos" && <CardapioBolosTab />}

          {/* ── CONFIGURADOR DE BOLOS ── */}
          {tab === "config-configurador" && <ConfiguradorBolosTab />}

          {/* ── SITE CONTEÚDO ── */}
          {tab === "site-conteudo" && <SiteTab />}
          {tab === "pronta-entrega" && <ProntaEntregaTab />}

          {/* ── METAS ── */}
          {tab === "metas" && (
            <MetasTab metas={metas} onUpdate={setMetas} receitas={receitas} despesas={despesas} catReceita={catReceita} catDespesa={catDespesa} />
          )}

          {/* ── RELATÓRIOS ── */}
          {tab === "relatorios" && <RelatoriosTab relatorio={relatorioAtivo} receitas={receitas} despesas={despesas} transferencias={transferencias} bancos={bancos} catReceita={catReceita} catDespesa={catDespesa} metas={metas} saldos={saldos} />}

          {/* ── IMPORTAR IFOOD ── */}
          {tab === "importar-ifood" && (
            <ImportarIFoodTab
              receitas={receitas} setReceitas={saveReceitas}
              despesas={despesas} setDespesas={saveDespesas}
              showToast={showToast} onRegistrar={registrarImportacao}
            />
          )}

          {/* ── IMPORTAR IFOOD HG ── */}
          {tab === "importar-ifood-hg" && (
            <ImportarIFoodHGTab
              receitas={receitas} setReceitas={saveReceitas}
              despesas={despesas} setDespesas={saveDespesas}
              showToast={showToast} onRegistrar={registrarImportacao}
            />
          )}

          {/* ── IMPORTAR 99FOOD HG ── */}
          {tab === "importar-99food-hg" && (
            <Importar99FoodTab
              receitas={receitas} setReceitas={saveReceitas}
              despesas={despesas} setDespesas={saveDespesas}
              showToast={showToast} onRegistrar={registrarImportacao}
            />
          )}

          {/* ── IMPORTAR 99FOOD TIJUCA ── */}
          {tab === "importar-99food-tjk" && (
            <Importar99FoodTJKTab
              receitas={receitas} setReceitas={saveReceitas}
              despesas={despesas} setDespesas={saveDespesas}
              showToast={showToast}
            />
          )}

          {/* ── IMPORTAR EXTRATOS ── */}
          {tab === "importar-extratos" && (
            <ImportarExtratosTab
              receitas={receitas} setReceitas={saveReceitas}
              despesas={despesas} setDespesas={saveDespesas}
              transferencias={transferencias} setTransferencias={setTransferencias}
              bancos={bancos} catReceita={catReceita} catDespesa={catDespesa}
              showToast={showToast} onRegistrar={registrarImportacao} tiposDocto={tiposDocto} bancoCnpj={bancoCnpj}
            />
          )}

          {tab === "config" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 20, paddingBottom: 32 }}>
              <div style={{ background: "#1a1628", border: "1px solid #2d2640", borderRadius: 10, padding: "12px 16px" }}>
                <p style={{ margin: 0, fontSize: 13, color: "#c8b8e8", lineHeight: 1.6 }}>
                  ⚙️ Gerencie seus <strong style={{ color: "#c084fc" }}>planos de conta</strong> e <strong style={{ color: "#c084fc" }}>bancos</strong> aqui.
                  Clique em <strong style={{ color: "#4ade80" }}>▸</strong> para expandir. Use <strong style={{ color: "#c084fc" }}>✏️</strong> para renomear e <strong style={{ color: "#f87171" }}>🗑</strong> para excluir.
                </p>
              </div>
              <SaldosConfig saldos={saldos} onUpdate={setSaldos} bancos={bancos} />
              <SaldoAtualConfig saldos={saldos} bancos={bancos} receitas={receitas} despesas={despesas} transferencias={transferencias} />
              <ConfigSection title="Tipos de Receita" color="green" data={catReceita} onUpdate={setCatReceita} />
              <ConfigSection title="Tipos de Despesa" color="red" data={catDespesa} onUpdate={setCatDespesa} />
              <TiposDoctoConfig tiposDocto={tiposDocto} onUpdate={setTiposDocto} />
              <BancosConfig bancos={bancos} onUpdate={setBancos} bancoCnpj={bancoCnpj} onUpdateCnpj={setBancoCnpj}
                receitas={receitas} setReceitas={saveReceitas}
                despesas={despesas} setDespesas={saveDespesas}
                saldos={saldos} setSaldos={setSaldos}
                transferencias={transferencias} setTransferencias={setTransferencias}
                showToast={showToast} />
              <FornecedoresConfig fornecedores={fornecedores} onUpdate={setFornecedores} />

              {/* ── Zona de Perigo ── */}
              <div style={{ background:"#13101e", border:"1.5px solid #7f1d1d", borderRadius:12, padding:"16px 18px" }}>
                <div style={{ fontSize:13, fontWeight:800, color:"#f87171", marginBottom:6 }}>⚠️ Zona de Perigo</div>
                <div style={{ fontSize:12, color:"#8a7fa0", marginBottom:14, lineHeight:1.6 }}>
                  Apaga <strong style={{color:"#f0e8ff"}}>todos os dados</strong> do sistema — receitas, despesas, transferências, configurações e histórico de importações. 
                  Esta ação é <strong style={{color:"#f87171"}}>irreversível</strong>. Faça um backup antes.
                </div>
                {limparStatus === "idle" && (
                  <button onClick={() => setLimparStatus("confirmando")}
                    style={{ padding:"10px 20px", borderRadius:8, border:"1.5px solid #7f1d1d", background:"#1a0707", color:"#f87171", cursor:"pointer", fontWeight:700, fontSize:13 }}>
                    🗑 Apagar todos os dados
                  </button>
                )}
                {limparStatus === "confirmando" && (
                  <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                    <div style={{ background:"#2d0a0a", border:"1.5px solid #f87171", borderRadius:8, padding:"12px 14px", fontSize:13, color:"#fca5a5", fontWeight:600 }}>
                      ⚠️ Tem certeza? Isso vai apagar TUDO do banco de dados permanentemente.
                    </div>
                    <div style={{ display:"flex", gap:8 }}>
                      <button onClick={limparTudo}
                        style={{ padding:"10px 20px", borderRadius:8, border:"none", background:"#dc2626", color:"#fff", cursor:"pointer", fontWeight:800, fontSize:13 }}>
                        Sim, apagar tudo
                      </button>
                      <button onClick={() => setLimparStatus("idle")}
                        style={{ padding:"10px 20px", borderRadius:8, border:"1.5px solid #2d2640", background:"none", color:"#8a7fa0", cursor:"pointer", fontSize:13 }}>
                        Cancelar
                      </button>
                    </div>
                  </div>
                )}
                {limparStatus === "limpando" && (
                  <div style={{ color:"#f87171", fontSize:13, fontWeight:700 }}>⏳ Apagando dados...</div>
                )}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ── BOTTOM NAV — mobile only ── */}
      {isMobile && (
        <div style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 140,
          background: "linear-gradient(180deg,#0d0b15ee,#0d0b15)",
          backdropFilter: "blur(12px)",
          borderTop: "1px solid #2d2640",
          display: "flex", alignItems: "stretch",
          paddingBottom: "env(safe-area-inset-bottom, 0px)",
        }}>
          {[
            { id:"dashboard", icon:"◈", label:"Dashboard" },
            { id:"receitas",  icon:"↑", label:"Receitas"  },
            { id:"despesas",  icon:"↓", label:"Despesas"  },
            { id:"cardapio-bolos", icon:"🎂", label:"Bolos" },
            { id:"site-conteudo",  icon:"🌐", label:"Site"  },
            { id:"pronta-entrega", icon:"🛒", label:"Loja"  },
            { id:"config",    icon:"⚙", label:"Config"    },
            { id:"__menu__",  icon:"☰", label:"Menu"      },
          ].map(item => {
            const isActive = item.id === "__menu__"
              ? sidebarOpen
              : tab === item.id;
            return (
              <button key={item.id}
                onClick={() => {
                  if (item.id === "__menu__") { setSidebarOpen(o => !o); return; }
                  goTo(item.id); setSidebarOpen(false);
                }}
                style={{
                  flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
                  justifyContent: "center", gap: 3, padding: "8px 2px 10px",
                  background: "none", border: "none", cursor: "pointer",
                  color: isActive ? "#c084fc" : "#4a3f60",
                  position: "relative",
                }}>
                {isActive && (
                  <div style={{ position:"absolute", top:0, left:"20%", right:"20%", height:2,
                    background:"linear-gradient(90deg,#c084fc,#e85d8a)", borderRadius:"0 0 4px 4px" }} />
                )}
                <span style={{ fontSize: 18, lineHeight: 1 }}>{item.icon}</span>
                <span style={{ fontSize: 9, fontWeight: isActive ? 700 : 400, letterSpacing: "0.02em", lineHeight: 1 }}>
                  {item.label}
                </span>
              </button>
            );
          })}
        </div>
      )}

      {/* MODALS */}
      {modal === "receita" && (
        <Modal title={editItem ? "✏️ Editar Receita" : "📥 Nova Receita"} onClose={() => { setModal(null); setEditItem(null); }}>
          <ReceitaForm onSave={saveReceita} onCancel={() => { setModal(null); setEditItem(null); }}
            initial={editItem ? {
              ...editItem,
              descontos: editItem.descontos?.length
                // 1. Se a receita já tem descontos salvos diretamente nela, usa esses
                ? editItem.descontos
                : (() => {
                    // 2. Busca por receita_id (vínculo direto — mais preciso)
                    const porId = despesas.filter(d =>
                      d.receita_id && Number(d.receita_id) === Number(editItem.id)
                    );
                    if (porId.length > 0) return porId.map(d => ({
                      id: d.id,
                      tipo: d.descricao?.replace("Desconto/Taxa — ", "") || d.conta || "Desconto",
                      plano: d.plano || "",
                      conta: d.conta || "",
                      valor: String(d.valor || ""),
                    }));
                    // 3. Fallback: mesma data + banco + descrição correspondente
                    // Pega só o desconto cujo índice (por id) corresponde ao índice desta receita
                    if (editItem.documento === "Link de Pagamento") {
                      const todasReceitasDia = receitas
                        .filter(r => r.documento === "Link de Pagamento"
                          && (r.data || r.recebimento) === (editItem.data || editItem.recebimento)
                          && r.banco === editItem.banco)
                        .sort((a,b) => a.id - b.id);
                      const meuIndice = todasReceitasDia.findIndex(r => r.id === editItem.id);
                      const todosDescontosDia = despesas
                        .filter(d => d.descricao?.startsWith("Desconto/Taxa — ")
                          && d.banco === editItem.banco
                          && (d.data || d.pagamento) === (editItem.data || editItem.recebimento))
                        .sort((a,b) => a.id - b.id);
                      const meuDesconto = meuIndice >= 0 && meuIndice < todosDescontosDia.length
                        ? [todosDescontosDia[meuIndice]]
                        : [];
                      return meuDesconto.map(d => ({
                        id: d.id,
                        tipo: d.descricao?.replace("Desconto/Taxa — ", "") || "Desconto",
                        plano: d.plano || "",
                        conta: d.conta || "",
                        valor: String(d.valor || ""),
                      }));
                    }
                    return [];
                  })()
            } : null}
            catReceita={catReceita} catDespesa={catDespesa} bancos={bancos} tiposDocto={tiposDocto} />
        </Modal>
      )}
      {modal === "despesa" && (
        <Modal title={editItem ? "✏️ Editar Despesa" : "📤 Nova Despesa"} onClose={() => { setModal(null); setEditItem(null); }}>
          <DespesaForm onSave={saveDespesa} onCancel={() => { setModal(null); setEditItem(null); }} initial={editItem} catDespesa={catDespesa} bancos={bancos} tiposDocto={tiposDocto} />
        </Modal>
      )}
      {modal === "transf" && (
        <Modal title="⇌ Nova Transferência" onClose={() => setModal(null)}>
          <TransfForm onSave={saveTransf} onCancel={() => setModal(null)} bancos={bancos} />
        </Modal>
      )}

      {/* TOAST */}
      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: toast.type === "del" ? "#7f1d1d" : "#166534", color: "#fff", padding: "10px 20px", borderRadius: 10, fontSize: 13, fontWeight: 600, zIndex: 200, boxShadow: "0 4px 20px rgba(0,0,0,0.5)", whiteSpace: "nowrap" }}>
          {toast.type === "del" ? "🗑 " : "✅ "}{toast.msg}
        </div>
      )}

      {/* ALTERAR SENHA MODAL */}
      {modalSenha && (
        <AlterarSenhaModal
          onSave={handleChangeSenha}
          onClose={() => setModalSenha(false)}
        />
      )}

      {/* BACKUP EXPORT MODAL */}
      {modalBackup?.tipo === "export" && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ background:"#13101e", border:"1.5px solid #2d2640", borderRadius:16, padding:24, width:"100%", maxWidth:600, display:"flex", flexDirection:"column", gap:14 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div style={{ fontSize:16, fontWeight:800, color:"#c084fc" }}>📥 Backup — Copie o JSON abaixo</div>
              <button onClick={() => setModalBackup(null)} style={{ background:"none", border:"none", color:"#8a7fa0", cursor:"pointer", fontSize:20 }}>✕</button>
            </div>
            <p style={{ fontSize:12, color:"#8a7fa0", margin:0 }}>
              Selecione tudo (Ctrl+A), copie (Ctrl+C) e salve em um arquivo <strong>.json</strong> no seu computador.
            </p>
            <textarea
              readOnly
              value={modalBackup.json}
              style={{ background:"#0d0b15", border:"1px solid #2d2640", borderRadius:8, color:"#a0f0a0", fontFamily:"monospace", fontSize:11, padding:12, height:300, resize:"vertical", outline:"none" }}
              onFocus={e => e.target.select()}
            />
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button
                onClick={() => { navigator.clipboard.writeText(modalBackup.json).then(() => showToast("✅ Copiado!", "ok")); }}
                style={{ padding:"8px 20px", borderRadius:8, border:"none", background:"linear-gradient(135deg,#c084fc,#e85d8a)", color:"#fff", fontWeight:700, cursor:"pointer", fontSize:13 }}>
                📋 Copiar tudo
              </button>
              <button onClick={() => setModalBackup(null)}
                style={{ padding:"8px 16px", borderRadius:8, border:"1px solid #2d2640", background:"none", color:"#8a7fa0", cursor:"pointer", fontSize:13 }}>
                Fechar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const _root=ReactDOM.createRoot(document.getElementById("root"));
_root.render(React.createElement(App));


</script>









</body>
</html>
